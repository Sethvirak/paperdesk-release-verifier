name: Verifier self-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Reject application/data/credential material
        run: |
          set -euo pipefail
          test -z "$(find . -type f -size +1M -not -path './.git/*' -print -quit)"
          test -z "$(git ls-files | grep --extended-regexp --ignore-case '\.(sqlite|sqlite3|db|zip|tar|tgz|gz|7z|pem|pfx|key|env)$' || true)"
          test -z "$(git grep --line-number --extended-regexp '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{40,}|AccountKey=' -- . ':!tests/*' || true)"

      - name: Compile and run dependency-free tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify_candidate.py scripts/check_deadline.py
          python3 -m unittest discover -s tests -v

