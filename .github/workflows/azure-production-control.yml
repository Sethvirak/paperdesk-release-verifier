          fi
          export ARTIFACT_ID ARTIFACT_SHA256 ARTIFACT_MEMBER ARTIFACT_MEMBER_SHA256
          PYTHONPATH="paperdesk-registry-control" REQUEST="${request}" python3 - <<'PY'
          import datetime as dt, json, os, secrets
          from scripts import private_release_mailbox as core
          operation={"registry-bridge-preflight":"registry-bridge-preflight","bootstrap-current-production":"bootstrap-prepare","deploy-candidate":"prepare-candidate","persist-accepted-release":"persist-accepted-release","rollback-accepted-release":"prepare-rollback"}[os.environ["OPERATION"]]
          now=dt.datetime.now(dt.timezone.utc); stamp=lambda value:value.strftime("%Y-%m-%dT%H:%M:%S.")+f"{value.microsecond//1000:03d}Z"
          def descriptor(prefix):
              return {"blob":os.environ[prefix+"_BLOB"],"sha256":os.environ[prefix+"_SHA256"],"size":int(os.environ[prefix+"_SIZE"]),"etag":os.environ[prefix+"_ETAG"],"versionId":os.environ[prefix+"_VERSION_ID"]}
