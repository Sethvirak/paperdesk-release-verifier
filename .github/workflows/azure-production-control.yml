            test "$(sha256sum "${RUNNER_TEMP}/paperdesk-verified-release/${ARTIFACT_MEMBER}" | cut -d ' ' -f 1)" = "${ARTIFACT_MEMBER_SHA256}"
          elif [ "${OPERATION}" = "persist-accepted-release" ]; then
