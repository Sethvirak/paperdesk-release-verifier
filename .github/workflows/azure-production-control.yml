name: PaperDesk immutable Azure production control

on:
  workflow_call:
    inputs:
      operation:
        description: Release-state read-only registry bridge preflight, bootstrap, candidate deployment, live finalization, rollback, accepted-release persistence, or transient cleanup
        required: true
        type: string
      source_repository:
        required: true
        type: string
      source_sha:
        description: Exact release/artifact SHA; may differ from caller_sha for rollback or post-acceptance persistence
        required: true
        type: string
      caller_sha:
        description: Exact commit executing the calling workflow and binding the OIDC caller claim
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      source_run_attempt:
        required: true
        type: string
      candidate_run_id:
        description: Exact successful deploy-candidate workflow run; required only for accepted-release persistence
        required: false
        type: string
        default: ''
      candidate_run_attempt:
        description: Exact successful deploy-candidate workflow run attempt; required only for accepted-release persistence
        required: false
        type: string
        default: ''
      logical_operation_id:
        description: Stable SHA-256 authorization identifier; required only for rollback and reused across workflow reruns
        required: false
        type: string
        default: ''
      verified_artifact_name:
        required: false
        type: string
        default: ''
      verification_receipt_name:
        required: false
        type: string
        default: ''
      verification_receipt_sha256:
        required: false
        type: string
        default: ''
      acceptance_run_id:
        required: false
        type: string
        default: ''
      acceptance_run_attempt:
        required: false
        type: string
        default: ''
      acceptance_workflow_ref:
        required: false
        type: string
        default: ''
      production_acceptance_receipt_name:
        required: false
        type: string
        default: ''
      production_acceptance_receipt_sha256:
        required: false
        type: string
        default: ''
      accepted_manifest_blob:
        required: false
        type: string
        default: ''
      accepted_manifest_version_id:
        required: false
        type: string
        default: ''
      accepted_manifest_sha256:
        required: false
        type: string
        default: ''
      accepted_manifest_size:
        required: false
        type: string
        default: ''
      accepted_manifest_etag:
        required: false
        type: string
        default: ''
      pending_release_blob:
        required: false
        type: string
        default: ''
      pending_release_version_id:
        required: false
        type: string
        default: ''
      pending_release_sha256:
        required: false
        type: string
        default: ''
      pending_release_size:
        required: false
        type: string
        default: ''
      pending_release_etag:
        required: false
        type: string
        default: ''
      consumed_marker_blob:
        required: false
        type: string
        default: ''
      consumed_marker_version_id:
        required: false
        type: string
        default: ''
      consumed_marker_sha256:
        required: false
        type: string
        default: ''
      consumed_marker_size:
        required: false
        type: string
        default: ''
      consumed_marker_etag:
        required: false
        type: string
        default: ''
      evidence_run_id:
        required: false
        type: string
        default: ''
      evidence_run_attempt:
        required: false
        type: string
        default: ''
      evidence_artifact_name:
        required: false
        type: string
        default: ''
      evidence_bundle_sha256:
        required: false
        type: string
        default: ''
      expected_live_url:
        required: false
        type: string
        default: ''
      expected_app_name:
        required: false
        type: string
        default: ''
      expected_resource_group:
        required: false
        type: string
        default: ''
      control_workflow_ref:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
    outputs:
      operation_receipt_sha256:
        description: SHA-256 of the public-control decision/operation receipt
        value: ${{ jobs.azure_production_control.outputs.operation_receipt_sha256 }}
      operation_receipt_name:
        description: Retained public-control receipt artifact name
        value: ${{ jobs.azure_production_control.outputs.operation_receipt_name }}
      accepted_baseline_json:
        description: Exact signed/WORM accepted baseline descriptor emitted by bootstrap or persistence
        value: ${{ jobs.azure_production_control.outputs.accepted_baseline_json }}
      pending_release_json:
        description: Exact signed/WORM pending release descriptor emitted by candidate preparation
        value: ${{ jobs.azure_production_control.outputs.pending_release_json }}
      consumed_marker_json:
        description: Exact fixed create-only consumed marker emitted after candidate health proof
        value: ${{ jobs.azure_production_control.outputs.consumed_marker_json }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  azure_production_control:
    name: Authorize exact PaperDesk Azure production operation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: paperdesk-production-control
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      operation_receipt_sha256: ${{ steps.receipt.outputs.operation_receipt_sha256 }}
      operation_receipt_name: ${{ steps.receipt.outputs.operation_receipt_name }}
      accepted_baseline_json: ${{ steps.private_release_mailbox.outputs.accepted_baseline_json }}
      pending_release_json: ${{ steps.private_release_mailbox.outputs.pending_release_json }}
      consumed_marker_json: ${{ steps.private_release_mailbox.outputs.consumed_marker_json }}
    steps:
      - name: Validate immutable caller and operation coordinates before OIDC
        id: immutable_coordinates
        env:
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_WORKFLOW_REF: ${{ inputs.acceptance_workflow_ref }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ACCEPTED_MANIFEST_BLOB: ${{ inputs.accepted_manifest_blob }}
          ACCEPTED_MANIFEST_ETAG: ${{ inputs.accepted_manifest_etag }}
          ACCEPTED_MANIFEST_SIZE: ${{ inputs.accepted_manifest_size }}
          ACCEPTED_MANIFEST_VERSION_ID: ${{ inputs.accepted_manifest_version_id }}
          ACCEPTED_MANIFEST_SHA256: ${{ inputs.accepted_manifest_sha256 }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          CALLER_WORKFLOW_NAME: ${{ github.workflow }}
          CONTROL_WORKFLOW_REF: ${{ inputs.control_workflow_ref }}
          JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_APP_NAME: ${{ inputs.expected_app_name }}
          EXPECTED_LIVE_URL: ${{ inputs.expected_live_url }}
          EXPECTED_RESOURCE_GROUP: ${{ inputs.expected_resource_group }}
          OPERATION: ${{ inputs.operation }}
          LOGICAL_OPERATION_ID: ${{ inputs.logical_operation_id }}
          PENDING_RELEASE_BLOB: ${{ inputs.pending_release_blob }}
          PENDING_RELEASE_ETAG: ${{ inputs.pending_release_etag }}
          PENDING_RELEASE_SHA256: ${{ inputs.pending_release_sha256 }}
          PENDING_RELEASE_SIZE: ${{ inputs.pending_release_size }}
          PENDING_RELEASE_VERSION_ID: ${{ inputs.pending_release_version_id }}
          CONSUMED_MARKER_BLOB: ${{ inputs.consumed_marker_blob }}
          CONSUMED_MARKER_ETAG: ${{ inputs.consumed_marker_etag }}
          CONSUMED_MARKER_SHA256: ${{ inputs.consumed_marker_sha256 }}
          CONSUMED_MARKER_SIZE: ${{ inputs.consumed_marker_size }}
          CONSUMED_MARKER_VERSION_ID: ${{ inputs.consumed_marker_version_id }}
          PRODUCTION_ACCEPTANCE_RECEIPT_NAME: ${{ inputs.production_acceptance_receipt_name }}
          PRODUCTION_ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.production_acceptance_receipt_sha256 }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFIER_WORKFLOW_REF: Sethvirak/paperdesk-release-verifier/.github/workflows/verify-candidate.yml@${{ job.workflow_sha }}
          VERIFICATION_RECEIPT_NAME: ${{ inputs.verification_receipt_name }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
          VERIFIED_ARTIFACT_NAME: ${{ inputs.verified_artifact_name }}
          PRIVATE_RELEASE_ACTIVATION_JSON: ${{ vars.PAPERDESK_PRIVATE_RELEASE_ACTIVATION_JSON }}
          PRIVATE_RELEASE_BRIDGE_PACKAGE_SHA256: ${{ vars.PAPERDESK_PRIVATE_RELEASE_BRIDGE_PACKAGE_SHA256 }}
        run: |
          set -euo pipefail
          test "${SOURCE_REPOSITORY}" = "Sethvirak/MasterDataStructure"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CALLER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CONTROL_WORKFLOW_REF}" =~ ^Sethvirak/paperdesk-release-verifier/.github/workflows/azure-production-control\.yml@[0-9a-f]{40}$ ]]
          [[ "${RUNTIME_CONTROL_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${CONTROL_WORKFLOW_REF}" = "Sethvirak/paperdesk-release-verifier/.github/workflows/azure-production-control.yml@${RUNTIME_CONTROL_WORKFLOW_SHA}"
          test "${JOB_WORKFLOW_REPOSITORY}" = "Sethvirak/paperdesk-release-verifier"
          test "${JOB_WORKFLOW_FILE_PATH}" = ".github/workflows/azure-production-control.yml"
          test "${JOB_WORKFLOW_REF}" = "${CONTROL_WORKFLOW_REF}"
          test "${CALLER_SHA}" = "${GITHUB_SHA}"
          production_workflow_ref="Sethvirak/MasterDataStructure/.github/workflows/main_master-data-structure-sea-9c4e0d0d.yml@refs/heads/main"
          production_workflow_name="Build and deploy Node.js app to Azure Web App: master-data-structure-sea-9c4e0d0d"
          production_workflow_path=".github/workflows/main_master-data-structure-sea-9c4e0d0d.yml"
          persist_workflow_ref="Sethvirak/MasterDataStructure/.github/workflows/persist-accepted-release.yml@refs/heads/main"
          persist_workflow_name="Persist accepted PaperDesk release (dormant)"
          persist_workflow_path=".github/workflows/persist-accepted-release.yml"
          cleanup_workflow_ref="Sethvirak/MasterDataStructure/.github/workflows/production-oidc-canary.yml@refs/heads/main"
          cleanup_workflow_name="PaperDesk external-control OIDC canary"
          cleanup_workflow_path=".github/workflows/production-oidc-canary.yml"
          case "${OPERATION}" in
            registry-bridge-preflight|bootstrap-current-production|deploy-candidate|rollback-accepted-release|finalize-live-release)
              expected_caller_workflow_id="306965591"
              expected_caller_workflow_name="${production_workflow_name}"
              expected_caller_workflow_path="${production_workflow_path}"
              expected_caller_workflow_ref="${production_workflow_ref}"
              ;;
            persist-accepted-release)
              expected_caller_workflow_id="340547201"
              expected_caller_workflow_name="${persist_workflow_name}"
              expected_caller_workflow_path="${persist_workflow_path}"
              expected_caller_workflow_ref="${persist_workflow_ref}"
              ;;
            cleanup-transient)
              expected_caller_workflow_id="334414600"
              expected_caller_workflow_name="${cleanup_workflow_name}"
              expected_caller_workflow_path="${cleanup_workflow_path}"
              expected_caller_workflow_ref="${cleanup_workflow_ref}"
              ;;
            *) exit 1 ;;
          esac
          test "${CALLER_WORKFLOW_NAME}" = "${expected_caller_workflow_name}"
          test "${GITHUB_WORKFLOW_REF}" = "${expected_caller_workflow_ref}"
          case "${OPERATION}" in
            registry-bridge-preflight)
              test "${GITHUB_WORKFLOW_REF}" = "${production_workflow_ref}"
              [[ "${GITHUB_EVENT_NAME}" =~ ^(push|workflow_dispatch)$ ]]
              test "${SOURCE_RUN_ID}" = "${GITHUB_RUN_ID}"
              test "${SOURCE_RUN_ATTEMPT}" = "${GITHUB_RUN_ATTEMPT}"
              test -z "${VERIFIED_ARTIFACT_NAME}${VERIFICATION_RECEIPT_NAME}${VERIFICATION_RECEIPT_SHA256}${ACCEPTANCE_RUN_ID}${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}${EVIDENCE_RUN_ID}"
              ;;
            bootstrap-current-production)
              test "${SOURCE_SHA}" = "cef0242719d8f1ab19297c854f9d5e9c81dc3ead"
              test "${SOURCE_RUN_ID}" = "31665623339"
              test "${SOURCE_RUN_ATTEMPT}" = "1"
              test -z "${VERIFIED_ARTIFACT_NAME}${VERIFICATION_RECEIPT_NAME}${VERIFICATION_RECEIPT_SHA256}${ACCEPTANCE_RUN_ID}${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}${EVIDENCE_RUN_ID}"
              test "${GITHUB_WORKFLOW_REF}" = "${production_workflow_ref}"
              test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
              ;;
            cleanup-transient)
              test -z "${VERIFIED_ARTIFACT_NAME}${VERIFICATION_RECEIPT_NAME}${VERIFICATION_RECEIPT_SHA256}${ACCEPTANCE_RUN_ID}${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}${EVIDENCE_RUN_ID}"
              test "${SOURCE_SHA}" = "${CALLER_SHA}"
              test "${SOURCE_RUN_ID}" = "${GITHUB_RUN_ID}"
              test "${SOURCE_RUN_ATTEMPT}" = "${GITHUB_RUN_ATTEMPT}"
              test "${GITHUB_REPOSITORY}" = "${SOURCE_REPOSITORY}"
              test "${GITHUB_REF}" = "refs/heads/main"
              test "${GITHUB_WORKFLOW_REF}" = "${cleanup_workflow_ref}"
              [[ "${GITHUB_EVENT_NAME}" =~ ^(workflow_run|schedule|workflow_dispatch)$ ]]
              ;;
            deploy-candidate)
              test "${GITHUB_WORKFLOW_REF}" = "${production_workflow_ref}"
              [[ "${GITHUB_EVENT_NAME}" =~ ^(push|workflow_dispatch)$ ]]
              test "${VERIFIED_ARTIFACT_NAME}" = "paperdesk-azure-runtime-verified-${SOURCE_SHA}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTED_MANIFEST_BLOB}" =~ ^v2/accepted/[0-9a-f]{40}/[^/]+/manifest\.json$ ]]
              [[ "${ACCEPTED_MANIFEST_VERSION_ID}" =~ ^[A-Za-z0-9._=:+/-]{1,256}$ ]]
              [[ "${ACCEPTED_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTED_MANIFEST_SIZE}" =~ ^[1-9][0-9]*$ ]]
              [[ "${ACCEPTED_MANIFEST_ETAG}" =~ ^\"[^\"]+\"$ ]]
              [[ "${ACCEPTED_MANIFEST_ETAG}" != *$'\r'* && "${ACCEPTED_MANIFEST_ETAG}" != *$'\n'* ]]
              ;;
            rollback-accepted-release)
              test "${GITHUB_WORKFLOW_REF}" = "${production_workflow_ref}"
              test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
              [[ "${LOGICAL_OPERATION_ID}" =~ ^[0-9a-f]{64}$ ]]
              test "${VERIFIED_ARTIFACT_NAME}" = "paperdesk-azure-runtime-verified-${SOURCE_SHA}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTANCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${ACCEPTANCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              test "${ACCEPTANCE_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" = "paperdesk-production-acceptance-receipt-${SOURCE_SHA}"
              [[ "${PRODUCTION_ACCEPTANCE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTANCE_WORKFLOW_REF}" =~ ^Sethvirak/MasterDataStructure/.github/workflows/main_master-data-structure-sea-9c4e0d0d\.yml@${SOURCE_SHA}$ ]]
              [[ "${ACCEPTED_MANIFEST_BLOB}" =~ ^v2/accepted/${SOURCE_SHA}/[^/]+/manifest\.json$ ]]
              [[ "${ACCEPTED_MANIFEST_VERSION_ID}" =~ ^[A-Za-z0-9._=:+/-]{1,256}$ ]]
              [[ "${ACCEPTED_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTED_MANIFEST_SIZE}" =~ ^[1-9][0-9]*$ ]]
              [[ "${ACCEPTED_MANIFEST_ETAG}" =~ ^\"[^\"]+\"$ ]]
              [[ "${ACCEPTED_MANIFEST_ETAG}" != *$'\r'* && "${ACCEPTED_MANIFEST_ETAG}" != *$'\n'* ]]
              ;;
            finalize-live-release)
              test "${GITHUB_WORKFLOW_REF}" = "${production_workflow_ref}"
              test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
              test -z "${VERIFIED_ARTIFACT_NAME}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              ;;
            persist-accepted-release)
              test "${VERIFIED_ARTIFACT_NAME}" = "paperdesk-azure-runtime-verified-${SOURCE_SHA}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${CANDIDATE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              [[ "${ACCEPTANCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${ACCEPTANCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              test "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" = "paperdesk-production-acceptance-receipt-${SOURCE_SHA}"
              [[ "${PRODUCTION_ACCEPTANCE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTANCE_WORKFLOW_REF}" =~ ^Sethvirak/MasterDataStructure/.github/workflows/main_master-data-structure-sea-9c4e0d0d\.yml@${SOURCE_SHA}$ ]]
              [[ "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${EVIDENCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              test "${ACCEPTANCE_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${CANDIDATE_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${CANDIDATE_RUN_ID}" != "${ACCEPTANCE_RUN_ID}"
              test "${EVIDENCE_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${EVIDENCE_RUN_ID}" != "${CANDIDATE_RUN_ID}"
              test "${EVIDENCE_RUN_ID}" != "${ACCEPTANCE_RUN_ID}"
              test "${EVIDENCE_ARTIFACT_NAME}" = "paperdesk-production-acceptance-evidence-post-deploy-${SOURCE_SHA}"
              [[ "${EVIDENCE_BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              test "${GITHUB_REPOSITORY}" = "${SOURCE_REPOSITORY}"
              test "${GITHUB_SHA}" = "${CALLER_SHA}"
              test "${GITHUB_REF}" = "refs/heads/main"
              test "${GITHUB_RUN_ID}" != "${ACCEPTANCE_RUN_ID}"
              test "${GITHUB_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${GITHUB_RUN_ID}" != "${CANDIDATE_RUN_ID}"
              test "${GITHUB_RUN_ID}" != "${EVIDENCE_RUN_ID}"
              test "${GITHUB_WORKFLOW_REF}" = "${persist_workflow_ref}"
              test "${GITHUB_EVENT_NAME}" = "workflow_run"
              test -z "${EXPECTED_APP_NAME}${EXPECTED_RESOURCE_GROUP}${EXPECTED_LIVE_URL}"
              [[ "${PENDING_RELEASE_BLOB}" =~ ^v2/pending/${SOURCE_SHA}/[^/]+/manifest\.json$ ]]
              [[ "${PENDING_RELEASE_VERSION_ID}" =~ ^[A-Za-z0-9._=:+/-]{1,256}$ ]]
              [[ "${PENDING_RELEASE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${PENDING_RELEASE_SIZE}" =~ ^[1-9][0-9]*$ ]]
              [[ "${PENDING_RELEASE_ETAG}" =~ ^\"[^\"]+\"$ ]]
              [[ "${PENDING_RELEASE_ETAG}" != *$'\r'* && "${PENDING_RELEASE_ETAG}" != *$'\n'* ]]
              [[ "${CONSUMED_MARKER_BLOB}" =~ ^v2/pending/${SOURCE_SHA}/[^/]+/consumed\.json$ ]]
              [[ "${CONSUMED_MARKER_VERSION_ID}" =~ ^[A-Za-z0-9._=:+/-]{1,256}$ ]]
              [[ "${CONSUMED_MARKER_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${CONSUMED_MARKER_SIZE}" =~ ^[1-9][0-9]*$ ]]
              [[ "${CONSUMED_MARKER_ETAG}" =~ ^\"[^\"]+\"$ ]]
              [[ "${CONSUMED_MARKER_ETAG}" != *$'\r'* && "${CONSUMED_MARKER_ETAG}" != *$'\n'* ]]
              ;;
            *)
              echo "Unsupported Azure production operation."
              exit 1
              ;;
          esac
          echo "expected_caller_workflow_ref=${GITHUB_WORKFLOW_REF}" >> "${GITHUB_OUTPUT}"
          echo "expected_caller_event=${GITHUB_EVENT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "expected_caller_workflow_id=${expected_caller_workflow_id}" >> "${GITHUB_OUTPUT}"
          echo "expected_caller_workflow_name=${expected_caller_workflow_name}" >> "${GITHUB_OUTPUT}"
          echo "expected_caller_workflow_path=${expected_caller_workflow_path}" >> "${GITHUB_OUTPUT}"
          if [ "${OPERATION}" != "rollback-accepted-release" ]; then
            test -z "${LOGICAL_OPERATION_ID}"
          fi
          if [ "${OPERATION}" != "rollback-accepted-release" ] && [ "${OPERATION}" != "deploy-candidate" ]; then
            test -z "${ACCEPTED_MANIFEST_BLOB}${ACCEPTED_MANIFEST_VERSION_ID}${ACCEPTED_MANIFEST_SHA256}${ACCEPTED_MANIFEST_SIZE}${ACCEPTED_MANIFEST_ETAG}"
          fi
          if [ "${OPERATION}" != "persist-accepted-release" ]; then
            test -z "${CANDIDATE_RUN_ID}${CANDIDATE_RUN_ATTEMPT}"
            test -z "${PENDING_RELEASE_BLOB}${PENDING_RELEASE_VERSION_ID}${PENDING_RELEASE_SHA256}${PENDING_RELEASE_SIZE}${PENDING_RELEASE_ETAG}${CONSUMED_MARKER_BLOB}${CONSUMED_MARKER_VERSION_ID}${CONSUMED_MARKER_SHA256}${CONSUMED_MARKER_SIZE}${CONSUMED_MARKER_ETAG}"
          fi
          case "${OPERATION}" in
            persist-accepted-release|cleanup-transient)
              test -z "${EXPECTED_APP_NAME}${EXPECTED_RESOURCE_GROUP}${EXPECTED_LIVE_URL}"
              ;;
            *)
              test "${EXPECTED_APP_NAME}" = "master-data-structure-sea-9c4e0d0d"
              test "${EXPECTED_RESOURCE_GROUP}" = "rg-master-data-structure-sea"
              test "${EXPECTED_LIVE_URL}" = "https://master-data-structure-sea-9c4e0d0d.azurewebsites.net"
              ;;
          esac
          echo "control_workflow_sha=${RUNTIME_CONTROL_WORKFLOW_SHA}" >> "${GITHUB_OUTPUT}"
          [[ "${PRIVATE_RELEASE_BRIDGE_PACKAGE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -n "${PRIVATE_RELEASE_ACTIVATION_JSON}"
          jq --exit-status --arg workflowSha "${RUNTIME_CONTROL_WORKFLOW_SHA}" --arg packageSha "${PRIVATE_RELEASE_BRIDGE_PACKAGE_SHA256}" '
            .schemaVersion == 1
            and .status == "activated"
            and .activation.mergedControlWorkflowSha == $workflowSha
            and .activation.bridgePackageSha256 == $packageSha
            and ([.activation[] | select(. == null)] | length) == 0
            and .fixed.subscriptionId == "9c4e0d0d-602f-4cde-84bd-337250e5b64c"
            and .fixed.bridgeApp == "paperdesk-release-registry-bridge-v2-9c4e0d0d"
            and .fixed.registryAccount == "mdspdbak2608089c4e"
            and .fixed.registryContainer == "paperdesk-accepted-releases"
          ' <<< "${PRIVATE_RELEASE_ACTIVATION_JSON}" >/dev/null

      - name: Revalidate exact caller workflow identity before Azure login
        env:
          EXPECTED_CALLER_WORKFLOW_ID: ${{ steps.immutable_coordinates.outputs.expected_caller_workflow_id }}
          EXPECTED_CALLER_WORKFLOW_NAME: ${{ steps.immutable_coordinates.outputs.expected_caller_workflow_name }}
          EXPECTED_CALLER_WORKFLOW_PATH: ${{ steps.immutable_coordinates.outputs.expected_caller_workflow_path }}
          EXPECTED_CALLER_EVENT: ${{ steps.immutable_coordinates.outputs.expected_caller_event }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snapshot="${RUNNER_TEMP}/paperdesk-caller-workflow-run.json"
          test -n "${GH_TOKEN}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${snapshot}"
          test -f "${snapshot}" && test ! -L "${snapshot}" && test "$(stat --format=%s "${snapshot}")" -le 1048576
          jq --exit-status \
            --arg workflowId "${EXPECTED_CALLER_WORKFLOW_ID}" \
            --arg workflowName "${EXPECTED_CALLER_WORKFLOW_NAME}" \
            --arg workflowPath "${EXPECTED_CALLER_WORKFLOW_PATH}" \
            --arg event "${EXPECTED_CALLER_EVENT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg repositoryId "${GITHUB_REPOSITORY_ID}" \
            --arg ownerId "${GITHUB_REPOSITORY_OWNER_ID}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg headSha "${GITHUB_SHA}" '
              (.id | tostring) == $runId
              and (.run_attempt | tostring) == $runAttempt
              and (.workflow_id | tostring) == $workflowId
              and .name == $workflowName
              and .path == $workflowPath
              and .event == $event
              and .head_branch == "main"
              and .head_sha == $headSha
              and .repository.full_name == $repository
              and (.repository.id | tostring) == $repositoryId
              and (.repository.owner.id | tostring) == $ownerId
            ' "${snapshot}" >/dev/null
          rm -f "${snapshot}"

      - name: Prove exact reusable-workflow and caller claims before Azure login
        env:
          CONTROL_WORKFLOW_REF: ${{ inputs.control_workflow_ref }}
          CONTROL_WORKFLOW_SHA: ${{ steps.immutable_coordinates.outputs.control_workflow_sha }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          EXPECTED_ENVIRONMENT: paperdesk-production-control
          EXPECTED_CALLER_WORKFLOW_REF: ${{ steps.immutable_coordinates.outputs.expected_caller_workflow_ref }}
          EXPECTED_CALLER_EVENT: ${{ steps.immutable_coordinates.outputs.expected_caller_event }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          set -euo pipefail
          [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == https://* ]]
          [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *$'\n'* ]]
          [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *$'\r'* ]]
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          response="${RUNNER_TEMP}/paperdesk-external-control-oidc-response.json"
          trap 'rm -f "${response}"' EXIT INT TERM
          curl \
            --fail \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --max-redirs 0 \
            --max-time 30 \
            --max-filesize 65536 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --output "${response}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          OIDC_RESPONSE="${response}" node <<'NODE'
          'use strict';
          const fs = require('fs');
          const assert = require('assert/strict');
          const response = JSON.parse(fs.readFileSync(process.env.OIDC_RESPONSE, 'utf8'));
          assert.deepEqual(Object.keys(response), ['value']);
          assert.equal(typeof response.value, 'string');
          assert.ok(response.value.length < 32768);
          const parts = response.value.split('.');
          assert.equal(parts.length, 3);
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
          assert.equal(claims.aud, 'api://AzureADTokenExchange');
          assert.equal(claims.iss, 'https://token.actions.githubusercontent.com');
          assert.equal(claims.sub, 'repo:Sethvirak/MasterDataStructure:environment:paperdesk-production-control');
          assert.equal(claims.repository, process.env.SOURCE_REPOSITORY);
          assert.equal(String(claims.repository_id), '1287744543');
          assert.equal(String(claims.repository_owner_id), '202535166');
          assert.equal(claims.sha, process.env.CALLER_SHA);
          assert.equal(claims.ref, process.env.GITHUB_REF);
          assert.equal(String(claims.run_id), process.env.GITHUB_RUN_ID);
          assert.equal(String(claims.run_attempt), process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(claims.workflow_ref, process.env.EXPECTED_CALLER_WORKFLOW_REF);
          assert.equal(claims.event_name, process.env.EXPECTED_CALLER_EVENT);
          assert.equal(claims.job_workflow_ref, process.env.CONTROL_WORKFLOW_REF);
          assert.equal(claims.job_workflow_sha, process.env.CONTROL_WORKFLOW_SHA);
          assert.equal(claims.environment, process.env.EXPECTED_ENVIRONMENT);
          assert.ok(Number.isInteger(claims.iat) && Number.isInteger(claims.nbf) && Number.isInteger(claims.exp));
          const now = Math.floor(Date.now() / 1000);
          assert.ok(claims.nbf <= now + 30 && claims.exp >= now && claims.exp - claims.iat <= 900);
          NODE

      - name: Azure login from the immutable reusable-workflow identity
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove exact Azure subscription after claim-bound login
        id: azure_session
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          account_json="$(az account show --output json)"
          jq --exit-status \
            --arg clientId "${AZURE_CLIENT_ID}" \
            --arg subscriptionId "${AZURE_SUBSCRIPTION_ID}" \
            --arg tenantId "${AZURE_TENANT_ID}" '
            .id == $subscriptionId
            and .tenantId == $tenantId
            and .state == "Enabled"
            and .user == {name: $clientId, type: "servicePrincipal"}
          ' <<< "${account_json}" >/dev/null
          echo "confirmed=true" >> "${GITHUB_OUTPUT}"

      - name: Download exact externally verified release material
        if: inputs.operation == 'deploy-candidate' || inputs.operation == 'persist-accepted-release'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.verified_artifact_name }}
          path: ${{ runner.temp }}/paperdesk-verified-release
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact external verification receipt
        if: inputs.operation == 'deploy-candidate' || inputs.operation == 'persist-accepted-release' || inputs.operation == 'finalize-live-release'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.verification_receipt_name }}
          path: ${{ runner.temp }}/paperdesk-verification-receipt
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact receipt digest before any Azure mutation
        if: inputs.operation == 'deploy-candidate' || inputs.operation == 'persist-accepted-release' || inputs.operation == 'finalize-live-release'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFIER_WORKFLOW_REF: Sethvirak/paperdesk-release-verifier/.github/workflows/verify-candidate.yml@${{ job.workflow_sha }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/paperdesk-verification-receipt/paperdesk-candidate-verification-receipt-${SOURCE_SHA}.json"
          test -f "${receipt}" && test ! -L "${receipt}" && test "$(stat --format=%s "${receipt}")" -le 8192
          test "$(sha256sum "${receipt}" | cut -d ' ' -f 1)" = "${VERIFICATION_RECEIPT_SHA256}"
          jq --exit-status --arg sha "${SOURCE_SHA}" '
            .schemaVersion == 1
            and .status == "candidate-verified"
            and .candidateSha == $sha
            and .verifierWorkflow == env.VERIFIER_WORKFLOW_REF
          ' "${receipt}" >/dev/null

      - name: Resolve exact accepted-release artifact identities and digests
        id: registry_artifacts
        if: inputs.operation == 'persist-accepted-release'
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          PRODUCTION_ACCEPTANCE_RECEIPT_NAME: ${{ inputs.production_acceptance_receipt_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFICATION_RECEIPT_NAME: ${{ inputs.verification_receipt_name }}
          VERIFIED_ARTIFACT_NAME: ${{ inputs.verified_artifact_name }}
        run: |
          set -euo pipefail
          provenance="${RUNNER_TEMP}/paperdesk-verified-release/paperdesk-azure-runtime-${SOURCE_SHA}.provenance.json"
          test -f "${provenance}" && test ! -L "${provenance}" && test "$(stat --format=%s "${provenance}")" -le 65536
          source_workflow_path=".github/workflows/main_master-data-structure-sea-9c4e0d0d.yml"
          source_workflow_ref="Sethvirak/MasterDataStructure/.github/workflows/main_master-data-structure-sea-9c4e0d0d.yml@refs/heads/main"
          test "$(jq -r '.workflow' "${provenance}")" = "${source_workflow_ref}"
          test "$(jq -r '.repository' "${provenance}")" = "${SOURCE_REPOSITORY}"
          test "$(jq -r '.commit' "${provenance}")" = "${SOURCE_SHA}"
          test "$(jq -r '.runId | tostring' "${provenance}")" = "${SOURCE_RUN_ID}"
          test "$(jq -r '.runAttempt | tostring' "${provenance}")" = "${SOURCE_RUN_ATTEMPT}"
          source_event="$(jq -r '.invocation.eventName' "${provenance}")"
          test "${source_event}" = "push" || test "${source_event}" = "workflow_dispatch"
          resolve_artifact() {
            local run_id="$1" expected_attempt="$2" name="$3" prefix="$4" expected_path="$5" expected_event="$6"
            local run_json artifacts_json artifact_json
            run_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.id | tostring' <<< "${run_json}")" = "${run_id}"
            test "$(jq -r '.run_attempt | tostring' <<< "${run_json}")" = "${expected_attempt}"
            test "$(jq -r '.status' <<< "${run_json}")" = "completed"
            test "$(jq -r '.conclusion' <<< "${run_json}")" = "success"
            test "$(jq -r '.repository.full_name' <<< "${run_json}")" = "${SOURCE_REPOSITORY}"
            test "$(jq -r '.head_repository.full_name' <<< "${run_json}")" = "${SOURCE_REPOSITORY}"
            test "$(jq -r '.head_sha' <<< "${run_json}")" = "${SOURCE_SHA}"
            test "$(jq -r '.head_branch' <<< "${run_json}")" = "main"
            test "$(jq -r '.path' <<< "${run_json}")" = "${expected_path}"
            test "$(jq -r '.event' <<< "${run_json}")" = "${expected_event}"
            artifacts_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            test "$(jq --arg name "${name}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "${artifacts_json}")" -eq 1
            artifact_json="$(jq --arg name "${name}" '.artifacts[] | select(.name == $name and .expired == false)' <<< "${artifacts_json}")"
            test "$(jq -r '.workflow_run.id | tostring' <<< "${artifact_json}")" = "${run_id}"
            test "$(jq -r '.workflow_run.head_sha' <<< "${artifact_json}")" = "$(jq -r '.head_sha' <<< "${run_json}")"
            test "$(jq -r '.workflow_run.head_branch' <<< "${artifact_json}")" = "$(jq -r '.head_branch' <<< "${run_json}")"
            test "$(jq -r '.workflow_run.repository_id | tostring' <<< "${artifact_json}")" = "$(jq -r '.repository.id | tostring' <<< "${run_json}")"
            test "$(jq -r '.workflow_run.head_repository_id | tostring' <<< "${artifact_json}")" = "$(jq -r '.head_repository.id | tostring' <<< "${run_json}")"
            local id digest
            id="$(jq -r '.id | tostring' <<< "${artifact_json}")"
            digest="$(jq -r '.digest' <<< "${artifact_json}")"
            [[ "${id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${prefix}_id=${id}" >> "${GITHUB_OUTPUT}"
            echo "${prefix}_digest=${digest#sha256:}" >> "${GITHUB_OUTPUT}"
          }
          resolve_artifact "${SOURCE_RUN_ID}" "${SOURCE_RUN_ATTEMPT}" "${VERIFIED_ARTIFACT_NAME}" verified "${source_workflow_path}" "${source_event}"
          resolve_artifact "${SOURCE_RUN_ID}" "${SOURCE_RUN_ATTEMPT}" "${VERIFICATION_RECEIPT_NAME}" verification "${source_workflow_path}" "${source_event}"
          resolve_artifact "${CANDIDATE_RUN_ID}" "${CANDIDATE_RUN_ATTEMPT}" "paperdesk-deployment-coordinate-receipt-${SOURCE_SHA}" deployment "${source_workflow_path}" workflow_dispatch
          resolve_artifact "${ACCEPTANCE_RUN_ID}" "${ACCEPTANCE_RUN_ATTEMPT}" "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" acceptance ".github/workflows/main_master-data-structure-sea-9c4e0d0d.yml" workflow_dispatch
          resolve_artifact "${EVIDENCE_RUN_ID}" "${EVIDENCE_RUN_ATTEMPT}" "${EVIDENCE_ARTIFACT_NAME}" evidence ".github/workflows/production-evidence-intake.yml" workflow_dispatch
          candidate_jobs_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?per_page=100")"
          test "$(jq '[.jobs[] | select(.name == "Deploy exact candidate pending final acceptance" and .conclusion == "success")] | length' <<< "${candidate_jobs_json}")" -eq 1

      - name: Download exact deployment-coordinate receipt
        if: inputs.operation == 'persist-accepted-release'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: paperdesk-deployment-coordinate-receipt-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/paperdesk-deployment-coordinate-receipt
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact production-acceptance receipt
        if: inputs.operation == 'persist-accepted-release'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.production_acceptance_receipt_name }}
          path: ${{ runner.temp }}/paperdesk-production-acceptance-receipt
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}

      - name: Validate deployment-coordinate receipt before registry bridge activation
        if: inputs.operation == 'persist-accepted-release'
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/paperdesk-deployment-coordinate-receipt"
          receipt="${root}/paperdesk-deployment-coordinate-receipt-${SOURCE_SHA}.json"
          verification_receipt="${RUNNER_TEMP}/paperdesk-verification-receipt/paperdesk-candidate-verification-receipt-${SOURCE_SHA}.json"
          test "$(find "${root}" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test -f "${receipt}" && test ! -L "${receipt}" && test "$(stat --format=%s "${receipt}")" -le 4096
          test "$(wc -l < "${receipt}")" -eq 1
          candidate_runtime_sha256="$(jq -er '.archiveSha256 | select(test("^[0-9a-f]{64}$"))' "${verification_receipt}")"
          expected="${RUNNER_TEMP}/paperdesk-expected-deployment-coordinate-receipt.json"
          jq -cnS \
            --arg candidateRuntimeSha256 "${candidate_runtime_sha256}" \
            --arg candidateSha "${SOURCE_SHA}" \
            --arg candidateSourceRunAttempt "${SOURCE_RUN_ATTEMPT}" \
            --arg candidateSourceRunId "${SOURCE_RUN_ID}" \
            --arg deploymentRunAttempt "${CANDIDATE_RUN_ATTEMPT}" \
            --arg deploymentRunId "${CANDIDATE_RUN_ID}" \
            --arg schema "paperdesk-deployment-coordinate-receipt-v1" \
            --arg verifiedArtifactName "paperdesk-azure-runtime-verified-${SOURCE_SHA}" \
            '{candidateRuntimeSha256: $candidateRuntimeSha256, candidateSha: $candidateSha, candidateSourceRunAttempt: $candidateSourceRunAttempt, candidateSourceRunId: $candidateSourceRunId, deploymentRunAttempt: $deploymentRunAttempt, deploymentRunId: $deploymentRunId, schema: $schema, schemaVersion: 1, verifiedArtifactName: $verifiedArtifactName}' \
            > "${expected}"
          cmp --silent "${receipt}" "${expected}"

      - name: Validate production-acceptance receipt before registry bridge activation
        if: inputs.operation == 'persist-accepted-release'
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.registry_artifacts.outputs.evidence_id }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          PRODUCTION_ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.production_acceptance_receipt_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/paperdesk-production-acceptance-receipt/paperdesk-production-acceptance-receipt-${SOURCE_SHA}.json"
          verification_receipt="${RUNNER_TEMP}/paperdesk-verification-receipt/paperdesk-candidate-verification-receipt-${SOURCE_SHA}.json"
          contract="${RUNNER_TEMP}/paperdesk-verified-release/paperdesk-azure-runtime-${SOURCE_SHA}.acceptance-contract.json"
          test -f "${receipt}" && test ! -L "${receipt}" && test "$(stat --format=%s "${receipt}")" -le 65536
          test -f "${verification_receipt}" && test ! -L "${verification_receipt}"
          test -f "${contract}" && test ! -L "${contract}"
          test "$(sha256sum "${receipt}" | cut -d ' ' -f 1)" = "${PRODUCTION_ACCEPTANCE_RECEIPT_SHA256}"
          candidate_runtime_sha256="$(jq -r '.archiveSha256' "${verification_receipt}")"
          evidence_contract_sha256="$(sha256sum "${contract}" | cut -d ' ' -f 1)"
          [[ "${candidate_runtime_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${evidence_contract_sha256}" =~ ^[0-9a-f]{64}$ ]]
          jq --exit-status \
            --arg sha "${SOURCE_SHA}" \
            --arg candidateRunId "${CANDIDATE_RUN_ID}" \
            --arg candidateRunAttempt "${CANDIDATE_RUN_ATTEMPT}" \
            --arg acceptanceRunId "${ACCEPTANCE_RUN_ID}" \
            --arg evidenceRunId "${EVIDENCE_RUN_ID}" \
            --arg evidenceArtifactId "${EVIDENCE_ARTIFACT_ID}" \
            --arg evidenceBundleSha256 "${EVIDENCE_BUNDLE_SHA256}" \
            --arg evidenceContractSha256 "${evidence_contract_sha256}" \
            --arg candidateRuntimeSha256 "${candidate_runtime_sha256}" '
            keys == ["acceptanceWorkflowHeadSha", "acceptedAt", "acceptedByRunId", "candidateCompletedAt", "candidateFinalizeDeadline", "candidateRunAttempt", "candidateRunId", "candidateRuntimeSha256", "candidateSha", "environmentId", "evidenceArtifactId", "evidenceBundleSha256", "evidenceContractSha256", "evidenceRunId", "releaseScope", "schemaVersion", "status"]
            and .schemaVersion == 1
            and .status == "fully-accepted"
            and .candidateSha == $sha
            and .candidateRunId == $candidateRunId
            and .candidateRunAttempt == $candidateRunAttempt
            and .candidateRuntimeSha256 == $candidateRuntimeSha256
            and .acceptanceWorkflowHeadSha == $sha
            and .acceptedByRunId == $acceptanceRunId
            and .evidenceRunId == $evidenceRunId
            and .evidenceArtifactId == $evidenceArtifactId
            and .evidenceBundleSha256 == $evidenceBundleSha256
            and .evidenceContractSha256 == $evidenceContractSha256
            and (.releaseScope == "controlled-non-ha-pilot" or .releaseScope == "full-production")
            and (.environmentId | test("^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"))
            and (.candidateCompletedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"))
            and (.candidateFinalizeDeadline | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"))
            and (.acceptedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"))
          ' "${receipt}" >/dev/null

      - name: Capture exact live locked WORM policy through Azure control identity
        if: inputs.operation == 'persist-accepted-release'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          policy_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/rg-paperdesk-rollback-sea-20260808/providers/Microsoft.Storage/storageAccounts/mdspdbak2608089c4e/blobServices/default/containers/paperdesk-accepted-releases/immutabilityPolicies/default"
          policy="$(az rest --method get --url "https://management.azure.com${policy_id}?api-version=2025-06-01")"
          jq --exit-status --arg id "${policy_id}" '
            .id == $id
            and .name == "default"
            and .type == "Microsoft.Storage/storageAccounts/blobServices/containers/immutabilityPolicies"
            and (.etag | type == "string" and length > 0)
            and .properties.state == "Locked"
            and (.properties.immutabilityPeriodSinceCreationInDays | type == "number" and . >= 91 and floor == .)
            and (.properties.allowProtectedAppendWrites // false) == false
            and (.properties.allowProtectedAppendWritesAll // false) == false
          ' <<< "${policy}" >/dev/null
          snapshot="${RUNNER_TEMP}/paperdesk-registry-worm-snapshot.json"
          jq --arg observedAt "$(date --utc '+%Y-%m-%dT%H:%M:%SZ')" --arg storageAccount mdspdbak2608089c4e --arg container paperdesk-accepted-releases '
            {resourceId: .id, storageAccount: $storageAccount, container: $container, state: .properties.state, immutabilityPeriodSinceCreationInDays: .properties.immutabilityPeriodSinceCreationInDays, allowProtectedAppendWrites: (.properties.allowProtectedAppendWrites // false), allowProtectedAppendWritesAll: (.properties.allowProtectedAppendWritesAll // false), etag: .etag, observedAt: $observedAt}
          ' <<< "${policy}" > "${snapshot}"
          test -f "${snapshot}" && test ! -L "${snapshot}" && test "$(stat --format=%s "${snapshot}")" -le 8192

      - name: Capture exact live locked registry result WORM policy through Azure control identity
        if: inputs.operation == 'persist-accepted-release'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          policy_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/rg-paperdesk-rollback-sea-20260808/providers/Microsoft.Storage/storageAccounts/mdspdbak2608089c4e/blobServices/default/containers/paperdesk-registry-webjob-results/immutabilityPolicies/default"
          policy="$(az rest --method get --url "https://management.azure.com${policy_id}?api-version=2025-06-01")"
          jq --exit-status --arg id "${policy_id}" '
            .id == $id
            and .name == "default"
            and .type == "Microsoft.Storage/storageAccounts/blobServices/containers/immutabilityPolicies"
            and (.etag | type == "string" and length > 0)
            and .properties.state == "Locked"
            and (.properties.immutabilityPeriodSinceCreationInDays | type == "number" and . >= 91 and floor == .)
            and (.properties.allowProtectedAppendWrites // false) == false
            and (.properties.allowProtectedAppendWritesAll // false) == false
          ' <<< "${policy}" >/dev/null
          snapshot="${RUNNER_TEMP}/paperdesk-registry-result-worm-snapshot.json"
          jq --arg observedAt "$(date --utc '+%Y-%m-%dT%H:%M:%SZ')" --arg storageAccount mdspdbak2608089c4e --arg container paperdesk-registry-webjob-results '
            {resourceId: .id, storageAccount: $storageAccount, container: $container, state: .properties.state, immutabilityPeriodSinceCreationInDays: .properties.immutabilityPeriodSinceCreationInDays, allowProtectedAppendWrites: (.properties.allowProtectedAppendWrites // false), allowProtectedAppendWritesAll: (.properties.allowProtectedAppendWritesAll // false), etag: .etag, observedAt: $observedAt}
