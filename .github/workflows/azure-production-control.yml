          accepted=descriptor("ACCEPTED_MANIFEST") if operation in {"prepare-candidate","prepare-rollback"} else None
          pending=descriptor("PENDING_RELEASE") if operation=="persist-accepted-release" else None
          consumed=descriptor("CONSUMED_MARKER") if operation=="persist-accepted-release" else None
          logical_operation_id=os.environ["LOGICAL_OPERATION_ID"] if operation=="prepare-rollback" else None
          document={"schemaVersion":2,"requestType":"paperdesk-private-release-request","operation":operation,"repositoryId":base["repositoryId"] if bootstrap else os.environ["REPOSITORY_ID"],"ownerId":base["ownerId"] if bootstrap else os.environ["OWNER_ID"],"controlWorkflowSha":os.environ["CONTROL_WORKFLOW_SHA"],"sourceSha":base["sourceSha"] if bootstrap else os.environ["SOURCE_SHA"],"sourceRunId":base["sourceRunId"] if bootstrap else os.environ["SOURCE_RUN_ID"],"sourceRunAttempt":base["sourceRunAttempt"] if bootstrap else os.environ["SOURCE_RUN_ATTEMPT"],"candidateRunId":os.environ["CANDIDATE_RUN_ID"] if operation=="persist-accepted-release" else None,"candidateRunAttempt":os.environ["CANDIDATE_RUN_ATTEMPT"] if operation=="persist-accepted-release" else None,"artifactId":base["artifactId"] if bootstrap else (os.environ["ARTIFACT_ID"] if artifact_operation else ""),"artifactSha256":base["artifactSha256"] if bootstrap else (os.environ["ARTIFACT_SHA256"] if artifact_operation else ""),"artifactMember":base["artifactMember"] if bootstrap else (os.environ["ARTIFACT_MEMBER"] if artifact_operation else ""),"artifactMemberSha256":base["artifactMemberSha256"] if bootstrap else (os.environ["ARTIFACT_MEMBER_SHA256"] if artifact_operation else ""),"acceptanceRunId":os.environ["ACCEPTANCE_RUN_ID"] or os.environ["GITHUB_RUN_ID"],"acceptanceRunAttempt":os.environ["ACCEPTANCE_RUN_ATTEMPT"] or os.environ["GITHUB_RUN_ATTEMPT"],"logicalOperationId":logical_operation_id,"nonce":secrets.token_hex(16),"issuedAt":stamp(now),"expiresAt":stamp(now+dt.timedelta(minutes=15)),"acceptedBaseline":accepted,"pendingRelease":pending,"consumedMarker":consumed,"rollbackPreparation":None,"activationPlan":None,"activationProof":None}
          core.validate_request(document,now=now)
          open(os.environ["REQUEST"],"w",encoding="utf-8",newline="\n").write(json.dumps(document,sort_keys=True,separators=(",",":"))+"\n")
          PY
          activate=()
          if [ "${OPERATION}" = "bootstrap-current-production" ] || [ "${OPERATION}" = "deploy-candidate" ] || [ "${OPERATION}" = "rollback-accepted-release" ]; then activate=(--activate); fi
          test "$(git -C paperdesk-registry-control rev-parse HEAD)" = "${CONTROL_WORKFLOW_SHA}"
          test -z "$(git -C paperdesk-registry-control status --porcelain=v1 --untracked-files=all)"
          evidence="evidence/private-release-provisioning-evidence.json"
          runtime_receipt="evidence/private-release-bridge-runtime-receipt.json"
          test -f "paperdesk-registry-control/${evidence}" && test ! -L "paperdesk-registry-control/${evidence}"
          test -f "paperdesk-registry-control/${runtime_receipt}" && test ! -L "paperdesk-registry-control/${runtime_receipt}"
          pinned_evidence="${RUNNER_TEMP}/paperdesk-private-release-provisioning-evidence.pinned.json"
          pinned_runtime_receipt="${RUNNER_TEMP}/paperdesk-private-release-bridge-runtime-receipt.pinned.json"
          git -C paperdesk-registry-control show "${CONTROL_WORKFLOW_SHA}:${evidence}" > "${pinned_evidence}"
          git -C paperdesk-registry-control show "${CONTROL_WORKFLOW_SHA}:${runtime_receipt}" > "${pinned_runtime_receipt}"
          cmp --silent "${pinned_evidence}" "paperdesk-registry-control/${evidence}"
          cmp --silent "${pinned_runtime_receipt}" "paperdesk-registry-control/${runtime_receipt}"
          test "$(sha256sum "${pinned_evidence}" | cut -d ' ' -f 1)" = "$(jq --raw-output '.activation.provisioningEvidenceSha256' "${activation}")"
          test "$(sha256sum "${pinned_runtime_receipt}" | cut -d ' ' -f 1)" = "$(jq --raw-output '.bridgeRuntime.bootstrapReceiptSha256' "${pinned_evidence}")"
          rebuilt_package="${RUNNER_TEMP}/paperdesk-private-release-bridge-source-rebuilt.zip"
          (cd paperdesk-registry-control && python3 scripts/build_private_release_bridge_package.py --output "${rebuilt_package}") >/dev/null
          test "$(sha256sum "${rebuilt_package}" | cut -d ' ' -f 1)" = "${BRIDGE_PACKAGE_SHA256}"
          (cd paperdesk-registry-control && python3 scripts/private_release_external_controller.py --request "${request}" --activation "${activation}" --provisioning-evidence "${evidence}" --bridge-runtime-receipt "${runtime_receipt}" --workflow-sha "${CONTROL_WORKFLOW_SHA}" --package-sha "${BRIDGE_PACKAGE_SHA256}" --output "${result}" "${activate[@]}")
          test -s "${result}" && test ! -L "${result}"
          jq --exit-status '(.housekeeping | type == "array" and length > 0) and all(.housekeeping[]; .status == "complete" and .failures == [])' "${result}" >/dev/null
          echo "result_sha256=$(sha256sum "${result}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          case "${OPERATION}" in
            registry-bridge-preflight)
              records="$(jq --compact-output '.bridgeResult.records' "${result}")"
              ;;
            bootstrap-current-production)
              records="$(jq --compact-output '.consumedBridgeResult.records' "${result}")"
              ;;
            deploy-candidate)
              records="$(jq --compact-output '{acceptedBaseline:.bridgeResult.records.acceptedBaseline,pendingRelease:.bridgeResult.records.pendingRelease,consumedMarker:.consumedBridgeResult.records.consumedMarker}' "${result}")"
              ;;
            persist-accepted-release|rollback-accepted-release)
              records="$(jq --compact-output '.bridgeResult.records' "${result}")"
              ;;
            *) exit 1 ;;
          esac
          accepted_baseline="$(jq --compact-output '.acceptedBaseline' <<< "${records}")"
          pending_release="$(jq --compact-output '.pendingRelease' <<< "${records}")"
          consumed_marker="$(jq --compact-output '.consumedMarker' <<< "${records}")"
          jq --exit-status --argjson acceptedBaseline "${accepted_baseline}" --argjson pendingRelease "${pending_release}" --argjson consumedMarker "${consumed_marker}" '
            def descriptor:
              type == "object"
              and (keys == ["blob","etag","sha256","size","versionId"])
              and (.blob | type == "string")
              and (.sha256 | test("^[0-9a-f]{64}$"))
              and (.size | type == "number" and . >= 1 and floor == .)
              and (.etag | type == "string" and test("^\"[^\"\\r\\n]+\"$"))
              and (.versionId | type == "string" and test("^[A-Za-z0-9._=:+/-]{1,256}$"));
            ($acceptedBaseline == null or ($acceptedBaseline | descriptor))
            and ($pendingRelease == null or ($pendingRelease | descriptor))
            and ($consumedMarker == null or ($consumedMarker | descriptor))
          ' <<< '{}' >/dev/null
          case "${OPERATION}" in
            registry-bridge-preflight|rollback-accepted-release)
              test "${accepted_baseline}" != "null"; test "${pending_release}" = "null"; test "${consumed_marker}" = "null"
              ;;
            bootstrap-current-production)
              test "${accepted_baseline}" != "null"; test "${pending_release}" = "null"; test "${consumed_marker}" != "null"
              ;;
            deploy-candidate|persist-accepted-release)
              test "${accepted_baseline}" != "null"; test "${pending_release}" != "null"; test "${consumed_marker}" != "null"
              ;;
            *) exit 1 ;;
          esac
          [ "${accepted_baseline}" = "null" ] && accepted_baseline=""
          [ "${pending_release}" = "null" ] && pending_release=""
          [ "${consumed_marker}" = "null" ] && consumed_marker=""
          echo "accepted_baseline_json=${accepted_baseline}" >> "${GITHUB_OUTPUT}"
          echo "pending_release_json=${pending_release}" >> "${GITHUB_OUTPUT}"
          echo "consumed_marker_json=${consumed_marker}" >> "${GITHUB_OUTPUT}"
          rm -f "${activation}" "${request}" "${pinned_evidence}" "${pinned_runtime_receipt}" "${rebuilt_package}"

      - name: Create bounded control receipt
        id: receipt
        if: always()
        env:
          COORDINATES_SUCCEEDED: ${{ steps.immutable_coordinates.outcome == 'success' }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_WORKFLOW_REF: ${{ inputs.acceptance_workflow_ref }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_WORKFLOW_REF: ${{ inputs.control_workflow_ref }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          OPERATION: ${{ inputs.operation }}
          PRODUCTION_ACCEPTANCE_RECEIPT_NAME: ${{ inputs.production_acceptance_receipt_name }}
          PRODUCTION_ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.production_acceptance_receipt_sha256 }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFICATION_RECEIPT_NAME: ${{ inputs.verification_receipt_name }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/paperdesk-external-control-receipt"
          if [ "${COORDINATES_SUCCEEDED}" = "true" ]; then
            receipt_stem="paperdesk-external-control-${OPERATION}-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            receipt_stem="paperdesk-external-control-invalid-coordinates-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          receipt_name="${receipt_stem}.json"
          mkdir "${receipt_dir}"
          registry_persistence=null
          persistence_proof="${RUNNER_TEMP}/paperdesk-private-release-result.json"
          if [ "${OPERATION}" = "persist-accepted-release" ]; then
            if [ -f "${persistence_proof}" ] && [ ! -L "${persistence_proof}" ] \
              && [ "$(stat --format=%s "${persistence_proof}")" -le 131072 ] \
              && jq --exit-status '.bridgeResult.status == "complete" and .activation == null' "${persistence_proof}" >/dev/null 2>&1; then
              registry_persistence="$(jq --compact-output '.bridgeResult' "${persistence_proof}")"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "A successful accepted-release persistence run must retain its exact signed bridge result." >&2
              exit 1
            elif [ -e "${persistence_proof}" ] || [ -L "${persistence_proof}" ]; then
              registry_persistence='{"reason":"proof-malformed-oversized-or-unsafe","schemaVersion":0,"status":"unavailable"}'
            else
              registry_persistence='{"reason":"proof-not-produced","schemaVersion":0,"status":"unavailable"}'
            fi
          fi
          accepted_baseline=null
          pending_release=null
          consumed_marker=null
          descriptor_proof="${RUNNER_TEMP}/paperdesk-private-release-result.json"
          descriptor_projection="${RUNNER_TEMP}/paperdesk-private-release-descriptors.json"
          case "${OPERATION}" in
            registry-bridge-preflight|bootstrap-current-production|deploy-candidate|persist-accepted-release|rollback-accepted-release)
              projected=false
              if [ -f "${descriptor_proof}" ] && [ ! -L "${descriptor_proof}" ] \
                && [ "$(stat --format=%s "${descriptor_proof}")" -le 131072 ]; then
                if (
                  case "${OPERATION}" in
                    registry-bridge-preflight)
                      jq --compact-output '{acceptedBaseline:.bridgeResult.records.acceptedBaseline,pendingRelease:null,consumedMarker:null}' "${descriptor_proof}"
                      ;;
                    bootstrap-current-production)
                      jq --compact-output '{acceptedBaseline:.consumedBridgeResult.records.acceptedBaseline,pendingRelease:null,consumedMarker:.consumedBridgeResult.records.consumedMarker}' "${descriptor_proof}"
                      ;;
                    deploy-candidate)
                      jq --compact-output '{acceptedBaseline:.bridgeResult.records.acceptedBaseline,pendingRelease:.bridgeResult.records.pendingRelease,consumedMarker:.consumedBridgeResult.records.consumedMarker}' "${descriptor_proof}"
                      ;;
                    persist-accepted-release)
                      jq --compact-output '{acceptedBaseline:.bridgeResult.records.acceptedBaseline,pendingRelease:.bridgeResult.records.pendingRelease,consumedMarker:.bridgeResult.records.consumedMarker}' "${descriptor_proof}"
                      ;;
                    rollback-accepted-release)
                      jq --compact-output '{acceptedBaseline:.bridgeResult.records.acceptedBaseline,pendingRelease:null,consumedMarker:null}' "${descriptor_proof}"
                      ;;
                  esac
                ) > "${descriptor_projection}" 2>/dev/null; then
                  if jq --exit-status --arg operation "${OPERATION}" --arg sha "${SOURCE_SHA}" '
                    def descriptor:
                      type == "object"
                      and (keys == ["blob","etag","sha256","size","versionId"])
                      and (.blob | type == "string")
                      and (.sha256 | test("^[0-9a-f]{64}$"))
                      and (.size | type == "number" and . >= 1 and floor == .)
                      and (.etag | type == "string" and test("^\"[^\"\\r\\n]+\"$"))
                      and (.versionId | type == "string" and test("^[A-Za-z0-9._=:+/-]{1,256}$"));
                    (keys == ["acceptedBaseline","consumedMarker","pendingRelease"])
                    and (.acceptedBaseline | descriptor)
                    and (.acceptedBaseline.blob | test("^v2/accepted/[0-9a-f]{40}/(bootstrap-consumed/)?manifest\\.json$"))
                    and (.pendingRelease == null or (.pendingRelease | descriptor))
                    and (.consumedMarker == null or (.consumedMarker | descriptor))
                    and (if $operation == "registry-bridge-preflight" then
                           (.acceptedBaseline.blob == ("v2/accepted/"+$sha+"/manifest.json")
                            or (.acceptedBaseline.blob == ("v2/accepted/"+$sha+"/bootstrap-consumed/manifest.json") and $sha == "cef0242719d8f1ab19297c854f9d5e9c81dc3ead"))
                           and .pendingRelease == null and .consumedMarker == null
                         elif $operation == "bootstrap-current-production" then
                           .acceptedBaseline.blob == ("v2/accepted/"+$sha+"/bootstrap-consumed/manifest.json")
                           and .pendingRelease == null
                           and (.consumedMarker | descriptor)
                           and .consumedMarker.blob == "v2/bootstrap/current-production/consumed.json"
                         elif $operation == "deploy-candidate" or $operation == "persist-accepted-release" then
                           (.pendingRelease | descriptor)
                           and (.pendingRelease.blob | test("^v2/pending/"+$sha+"/[^/]+/manifest\\.json$"))
                           and (.consumedMarker | descriptor)
                           and (.consumedMarker.blob | test("^v2/pending/"+$sha+"/[^/]+/consumed\\.json$"))
                         elif $operation == "rollback-accepted-release" then
                           (.acceptedBaseline.blob == ("v2/accepted/"+$sha+"/manifest.json")
                            or (.acceptedBaseline.blob == ("v2/accepted/"+$sha+"/bootstrap-consumed/manifest.json") and $sha == "cef0242719d8f1ab19297c854f9d5e9c81dc3ead"))
                           and .pendingRelease == null and .consumedMarker == null
                         else false end)
                  ' "${descriptor_projection}" >/dev/null 2>&1; then
                    accepted_baseline="$(jq --compact-output '.acceptedBaseline' "${descriptor_projection}")"
                    pending_release="$(jq --compact-output '.pendingRelease' "${descriptor_projection}")"
                    consumed_marker="$(jq --compact-output '.consumedMarker' "${descriptor_projection}")"
                    projected=true
                  fi
                fi
              fi
              if [ "${projected}" != "true" ] && [ "${{ job.status }}" = "success" ]; then
                echo "A successful registry operation must retain exact accepted/pending/consumed descriptors." >&2
                exit 1
              fi
              ;;
          esac
          deployment=null
          deployment_proof="${RUNNER_TEMP}/paperdesk-deployment-proof.json"
          if [ "${OPERATION}" = "deploy-candidate" ]; then
            if [ -f "${deployment_proof}" ] && [ ! -L "${deployment_proof}" ] \
              && [ "$(stat --format=%s "${deployment_proof}")" -le 65536 ] \
              && jq --exit-status --arg operation "${OPERATION}" --arg sha "${SOURCE_SHA}" '
                .schema == "paperdesk-azure-production-deployment-command-v1"
                and .status == "cli-reported-success-pending-live-finalization"
                and .operation == $operation
                and .sourceSha == $sha
                and .mutationCount == 1
                and .retryAllowedAfterAmbiguousFailure == false
              ' "${deployment_proof}" >/dev/null 2>&1; then
              deployment="$(jq --compact-output '.' "${deployment_proof}")"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "A successful deployment or rollback must retain its exact deployment proof." >&2
              exit 1
            fi
          fi
          rollback_registry_binding=null
          rollback_binding_proof="${RUNNER_TEMP}/paperdesk-private-release-result.json"
          if [ "${OPERATION}" = "rollback-accepted-release" ]; then
            if [ -f "${rollback_binding_proof}" ] && [ ! -L "${rollback_binding_proof}" ] \
              && [ "$(stat --format=%s "${rollback_binding_proof}")" -le 131072 ] \
              && jq --exit-status --arg sha "${SOURCE_SHA}" '
                .bridgeResult.status == "complete"
                and .bridgeResult.operation == "rollback-accepted-release"
                and .bridgeResult.sourceSha == $sha
                and .activation.sourceSha == $sha
                and .activation.settlement.healthy == true
              ' "${rollback_binding_proof}" >/dev/null 2>&1; then
              rollback_registry_binding="$(jq --compact-output '{bridgeResult:.bridgeResult,activation:.activation}' "${rollback_binding_proof}")"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "A successful rollback must retain its exact accepted-release registry binding." >&2
              exit 1
            fi
          fi
          live_finalization=null
          live_finalization_proof="${RUNNER_TEMP}/paperdesk-live-finalization-proof.json"
          if [ "${OPERATION}" = "finalize-live-release" ]; then
            if [ -f "${live_finalization_proof}" ] && [ ! -L "${live_finalization_proof}" ] \
              && [ "$(stat --format=%s "${live_finalization_proof}")" -le 65536 ] \
              && jq --exit-status --arg sha "${SOURCE_SHA}" '
                .schema == "paperdesk-azure-production-finalization-v1"
                and .status == "verified"
                and .operation == "finalize-live-release"
                and .sourceSha == $sha
                and (.probes | keys) == ["appHealth", "liveness", "readiness", "runtimeReleaseSha", "securityInfo"]
              ' "${live_finalization_proof}" >/dev/null 2>&1; then
              live_finalization="$(jq --compact-output '.' "${live_finalization_proof}")"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "A successful finalization must retain its exact live health and security proof." >&2
              exit 1
            fi
          fi
          transient_cleanup=null
          transient_cleanup_proof="${RUNNER_TEMP}/paperdesk-private-release-transient-cleanup.json"
          if [ "${OPERATION}" = "cleanup-transient" ]; then
            if [ -f "${transient_cleanup_proof}" ] && [ ! -L "${transient_cleanup_proof}" ] \
              && [ "$(stat --format=%s "${transient_cleanup_proof}")" -le 4096 ] \
              && jq --exit-status '.schemaVersion == 1 and (.status == "clean" or .status == "cleaned")' "${transient_cleanup_proof}" >/dev/null 2>&1; then
              transient_cleanup="$(jq --compact-output '.' "${transient_cleanup_proof}")"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "A successful transient cleanup must retain its exact bounded proof." >&2
              exit 1
            fi
          fi
          jq --null-input \
            --arg schemaVersion '6' \
            --arg status "${{ job.status }}" \
            --arg operation "${OPERATION}" \
            --arg sourceRepository "${SOURCE_REPOSITORY}" \
            --arg callerWorkflowRef "${GITHUB_WORKFLOW_REF}" \
            --arg sourceSha "${SOURCE_SHA}" \
            --arg sourceRunId "${SOURCE_RUN_ID}" \
            --arg sourceRunAttempt "${SOURCE_RUN_ATTEMPT}" \
            --arg candidateRunId "${CANDIDATE_RUN_ID}" \
            --arg candidateRunAttempt "${CANDIDATE_RUN_ATTEMPT}" \
            --arg controlWorkflowRef "${CONTROL_WORKFLOW_REF}" \
            --arg controlRunId "${GITHUB_RUN_ID}" \
            --arg controlRunAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg acceptanceRunId "${ACCEPTANCE_RUN_ID}" \
            --arg acceptanceRunAttempt "${ACCEPTANCE_RUN_ATTEMPT}" \
            --arg acceptanceWorkflowRef "${ACCEPTANCE_WORKFLOW_REF}" \
            --arg evidenceRunId "${EVIDENCE_RUN_ID}" \
            --arg evidenceRunAttempt "${EVIDENCE_RUN_ATTEMPT}" \
            --arg evidenceArtifactName "${EVIDENCE_ARTIFACT_NAME}" \
            --arg evidenceBundleSha256 "${EVIDENCE_BUNDLE_SHA256}" \
            --arg verificationReceiptName "${VERIFICATION_RECEIPT_NAME}" \
            --arg verificationReceiptSha256 "${VERIFICATION_RECEIPT_SHA256}" \
            --arg productionAcceptanceReceiptName "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" \
            --arg productionAcceptanceReceiptSha256 "${PRODUCTION_ACCEPTANCE_RECEIPT_SHA256}" \
            --argjson acceptedBaseline "${accepted_baseline}" \
            --argjson pendingRelease "${pending_release}" \
            --argjson consumedMarker "${consumed_marker}" \
            --argjson registryPersistence "${registry_persistence}" \
            --argjson deployment "${deployment}" \
            --argjson rollbackRegistryBinding "${rollback_registry_binding}" \
            --argjson liveFinalization "${live_finalization}" \
            --argjson transientCleanup "${transient_cleanup}" \
            --arg registryPrefix "$(if [ "${OPERATION}" = "registry-bridge-preflight" ] || [ "${OPERATION}" = "persist-accepted-release" ]; then printf 'v2/accepted/%s/' "${SOURCE_SHA}"; elif [ "${OPERATION}" = "rollback-accepted-release" ]; then printf 'v2/rollback/%s/' "${SOURCE_SHA}"; fi)" \
            '{schemaVersion: ($schemaVersion | tonumber), status: $status, operation: $operation, sourceRepository: $sourceRepository, callerWorkflowRef: $callerWorkflowRef, sourceSha: $sourceSha, sourceRunId: $sourceRunId, sourceRunAttempt: $sourceRunAttempt, candidateRunId: (if ($candidateRunId | test("^[1-9][0-9]*$")) then $candidateRunId else null end), candidateRunAttempt: (if ($candidateRunAttempt | test("^[1-9][0-9]*$")) then $candidateRunAttempt else null end), controlWorkflowRef: $controlWorkflowRef, controlRunId: $controlRunId, controlRunAttempt: $controlRunAttempt, acceptanceRunId: $acceptanceRunId, acceptanceRunAttempt: $acceptanceRunAttempt, acceptanceWorkflowRef: $acceptanceWorkflowRef, evidenceRunId: $evidenceRunId, evidenceRunAttempt: $evidenceRunAttempt, evidenceArtifactName: $evidenceArtifactName, evidenceBundleSha256: $evidenceBundleSha256, verificationReceiptName: $verificationReceiptName, verificationReceiptSha256: $verificationReceiptSha256, productionAcceptanceReceiptName: $productionAcceptanceReceiptName, productionAcceptanceReceiptSha256: $productionAcceptanceReceiptSha256, acceptedBaseline: $acceptedBaseline, pendingRelease: $pendingRelease, consumedMarker: $consumedMarker, registryPersistence: $registryPersistence, registryPrefix: $registryPrefix, deployment: $deployment, rollbackRegistryBinding: $rollbackRegistryBinding, liveFinalization: $liveFinalization, transientCleanup: $transientCleanup}' \
            > "${receipt_dir}/${receipt_name}"
          test -f "${receipt_dir}/${receipt_name}" && test ! -L "${receipt_dir}/${receipt_name}"
          test "$(stat --format=%s "${receipt_dir}/${receipt_name}")" -le 1048576
          echo "operation_receipt_name=${receipt_stem}" >> "${GITHUB_OUTPUT}"
          echo "operation_receipt_sha256=$(sha256sum "${receipt_dir}/${receipt_name}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Retain immutable-control receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.receipt.outputs.operation_receipt_name }}
          path: ${{ runner.temp }}/paperdesk-external-control-receipt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
