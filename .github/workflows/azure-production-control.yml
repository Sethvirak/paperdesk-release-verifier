      - name: Verify exact live release without redeployment
        if: inputs.operation == 'finalize-live-release'
        env:
          EXPECTED_LIVE_URL: ${{ inputs.expected_live_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          EXPECTED_LIVE_URL="${EXPECTED_LIVE_URL}" \
          SOURCE_SHA="${SOURCE_SHA}" \
          OUTPUT="${RUNNER_TEMP}/paperdesk-live-finalization-proof.json" \
          python3 - <<'PY'
          import os
          from pathlib import Path
          import ssl
          import urllib.error
          import urllib.request
          from scripts import azure_production_release_control as control

          if os.environ["EXPECTED_LIVE_URL"] != control.LIVE_ORIGIN:
              raise SystemExit("live origin differs from the fixed release-control origin")

          class RejectRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              RejectRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )

          def transport(request):
              if request.method != "GET" or request.body is not None:
                  raise control.ReleaseControlError("finalization transport is read-only")
              outgoing = urllib.request.Request(
                  request.url,
                  headers=dict(request.headers),
                  method="GET",
              )
              try:
                  with opener.open(outgoing, timeout=request.timeout_seconds) as response:
                      body = response.read(request.maximum_response_bytes + 1)
                      if len(body) > request.maximum_response_bytes:
                          raise control.ReleaseControlError("finalization response is excessive")
                      return control.HttpResponse(
                          status=response.status,
                          url=response.geturl(),
                          headers={name.lower(): value for name, value in response.headers.items()},
                          body=body,
                      )
              except urllib.error.HTTPError as exc:
                  body = exc.read(request.maximum_response_bytes + 1)
                  return control.HttpResponse(
                      status=exc.code,
                      url=exc.geturl(),
                      headers={name.lower(): value for name, value in exc.headers.items()},
                      body=body,
                  )

          receipt = control.finalize_live_release(os.environ["SOURCE_SHA"], transport)
          Path(os.environ["OUTPUT"]).write_bytes(control.canonical_json(receipt))
          PY
          test -f "${RUNNER_TEMP}/paperdesk-live-finalization-proof.json"
          test ! -L "${RUNNER_TEMP}/paperdesk-live-finalization-proof.json"

      - name: Persist or recover release exclusively through the signed private mailbox
        id: private_release_mailbox
        if: steps.azure_session.outputs.confirmed == 'true' && (inputs.operation == 'registry-bridge-preflight' || inputs.operation == 'bootstrap-current-production' || inputs.operation == 'deploy-candidate' || inputs.operation == 'persist-accepted-release' || inputs.operation == 'rollback-accepted-release')
        env:
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
