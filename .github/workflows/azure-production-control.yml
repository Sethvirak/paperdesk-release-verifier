name: PaperDesk immutable Azure production control

on:
  workflow_call:
    inputs:
      operation:
        description: Read-only OIDC canary, registry bridge preflight, candidate deployment, live finalization, rollback, or accepted-release persistence
        required: true
        type: string
      source_repository:
        required: true
        type: string
      source_sha:
        description: Exact release/artifact SHA; may differ from caller_sha for rollback or post-acceptance persistence
        required: true
        type: string
      caller_sha:
        description: Exact commit executing the calling workflow and binding the OIDC caller claim
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      source_run_attempt:
        required: true
        type: string
      verified_artifact_name:
        required: false
        type: string
        default: ''
      verification_receipt_name:
        required: false
        type: string
        default: ''
      verification_receipt_sha256:
        required: false
        type: string
        default: ''
      acceptance_run_id:
        required: false
        type: string
        default: ''
      acceptance_run_attempt:
        required: false
        type: string
        default: ''
      acceptance_workflow_ref:
        required: false
        type: string
        default: ''
      production_acceptance_receipt_name:
        required: false
        type: string
        default: ''
      production_acceptance_receipt_sha256:
        required: false
        type: string
        default: ''
      evidence_run_id:
        required: false
        type: string
        default: ''
      evidence_run_attempt:
        required: false
        type: string
        default: ''
      evidence_artifact_name:
        required: false
        type: string
        default: ''
      evidence_bundle_sha256:
        required: false
        type: string
        default: ''
      registry_preflight_source_sha:
        required: false
        type: string
        default: ''
      registry_preflight_run_id:
        required: false
        type: string
        default: ''
      registry_preflight_run_attempt:
        required: false
        type: string
        default: ''
      registry_preflight_receipt_sha256:
        required: false
        type: string
        default: ''
      expected_live_url:
        required: false
        type: string
        default: ''
      expected_app_name:
        required: false
        type: string
        default: ''
      expected_resource_group:
        required: false
        type: string
        default: ''
      control_workflow_ref:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
    outputs:
      operation_receipt_sha256:
        description: SHA-256 of the public-control decision/operation receipt
        value: ${{ jobs.azure_production_control.outputs.operation_receipt_sha256 }}
      operation_receipt_name:
        description: Retained public-control receipt artifact name
        value: ${{ jobs.azure_production_control.outputs.operation_receipt_name }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  azure_production_control:
    name: Authorize exact PaperDesk Azure production operation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: paperdesk-production-control
    concurrency:
      group: paperdesk-immutable-azure-production-control
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      operation_receipt_sha256: ${{ steps.receipt.outputs.operation_receipt_sha256 }}
      operation_receipt_name: ${{ steps.receipt.outputs.operation_receipt_name }}
    steps:
      - name: Validate immutable caller and operation coordinates before OIDC
        id: immutable_coordinates
        env:
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_WORKFLOW_REF: ${{ inputs.acceptance_workflow_ref }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          CONTROL_WORKFLOW_REF: ${{ inputs.control_workflow_ref }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_APP_NAME: ${{ inputs.expected_app_name }}
          EXPECTED_LIVE_URL: ${{ inputs.expected_live_url }}
          EXPECTED_RESOURCE_GROUP: ${{ inputs.expected_resource_group }}
          OPERATION: ${{ inputs.operation }}
          PRODUCTION_ACCEPTANCE_RECEIPT_NAME: ${{ inputs.production_acceptance_receipt_name }}
          PRODUCTION_ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.production_acceptance_receipt_sha256 }}
          REGISTRY_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.registry_preflight_receipt_sha256 }}
          REGISTRY_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.registry_preflight_run_attempt }}
          REGISTRY_PREFLIGHT_RUN_ID: ${{ inputs.registry_preflight_run_id }}
          REGISTRY_PREFLIGHT_SOURCE_SHA: ${{ inputs.registry_preflight_source_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFIER_WORKFLOW_REF: Sethvirak/paperdesk-release-verifier/.github/workflows/verify-candidate.yml@23fc16fca795e0c6786f35aae863167fe80aa3cd
          VERIFICATION_RECEIPT_NAME: ${{ inputs.verification_receipt_name }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
          VERIFIED_ARTIFACT_NAME: ${{ inputs.verified_artifact_name }}
        run: |
          set -euo pipefail
          test "${SOURCE_REPOSITORY}" = "Sethvirak/MasterDataStructure"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CALLER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CONTROL_WORKFLOW_REF}" =~ ^Sethvirak/paperdesk-release-verifier/.github/workflows/azure-production-control\.yml@[0-9a-f]{40}$ ]]
          test "${CALLER_SHA}" = "${GITHUB_SHA}"
          case "${OPERATION}" in
            oidc-canary-read-resource)
              test -z "${VERIFIED_ARTIFACT_NAME}${VERIFICATION_RECEIPT_NAME}${VERIFICATION_RECEIPT_SHA256}${ACCEPTANCE_RUN_ID}${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}${EVIDENCE_RUN_ID}"
              test "${SOURCE_SHA}" = "${CALLER_SHA}"
              test "${SOURCE_RUN_ID}" = "${GITHUB_RUN_ID}"
              test "${SOURCE_RUN_ATTEMPT}" = "${GITHUB_RUN_ATTEMPT}"
              ;;
            registry-bridge-preflight)
              test -z "${VERIFIED_ARTIFACT_NAME}${VERIFICATION_RECEIPT_NAME}${VERIFICATION_RECEIPT_SHA256}${ACCEPTANCE_RUN_ID}${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}${EVIDENCE_RUN_ID}"
              test "${SOURCE_SHA}" = "${CALLER_SHA}"
              test "${SOURCE_RUN_ID}" = "${GITHUB_RUN_ID}"
              test "${SOURCE_RUN_ATTEMPT}" = "${GITHUB_RUN_ATTEMPT}"
              test "${GITHUB_REPOSITORY}" = "${SOURCE_REPOSITORY}"
              test "${GITHUB_REF}" = "refs/heads/main"
              test "${GITHUB_WORKFLOW_REF}" = "Sethvirak/MasterDataStructure/.github/workflows/production-registry-bridge-preflight.yml@refs/heads/main"
              ;;
            deploy-candidate|rollback-accepted-release)
              test "${VERIFIED_ARTIFACT_NAME}" = "paperdesk-azure-runtime-verified-${SOURCE_SHA}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              ;;
            finalize-live-release)
              test -z "${VERIFIED_ARTIFACT_NAME}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              ;;
            persist-accepted-release)
              test "${VERIFIED_ARTIFACT_NAME}" = "paperdesk-azure-runtime-verified-${SOURCE_SHA}"
              test "${VERIFICATION_RECEIPT_NAME}" = "paperdesk-candidate-verification-receipt-${SOURCE_SHA}"
              [[ "${VERIFICATION_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTANCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${ACCEPTANCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              test "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" = "paperdesk-production-acceptance-receipt-${SOURCE_SHA}"
              [[ "${PRODUCTION_ACCEPTANCE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${ACCEPTANCE_WORKFLOW_REF}" =~ ^Sethvirak/MasterDataStructure/.github/workflows/main_master-data-structure-sea-9c4e0d0d\.yml@${SOURCE_SHA}$ ]]
              [[ "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${EVIDENCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              test "${ACCEPTANCE_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${EVIDENCE_RUN_ID}" != "${SOURCE_RUN_ID}"
              test "${EVIDENCE_RUN_ID}" != "${ACCEPTANCE_RUN_ID}"
              test "${EVIDENCE_ARTIFACT_NAME}" = "paperdesk-production-acceptance-evidence-post-deploy-${SOURCE_SHA}"
              [[ "${EVIDENCE_BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              test "${GITHUB_REPOSITORY}" = "${SOURCE_REPOSITORY}"
              test "${GITHUB_SHA}" = "${CALLER_SHA}"
              test "${GITHUB_REF}" = "refs/heads/main"
              test "${GITHUB_RUN_ID}" != "${ACCEPTANCE_RUN_ID}"
              test "${GITHUB_WORKFLOW_REF}" = "Sethvirak/MasterDataStructure/.github/workflows/persist-accepted-release.yml@refs/heads/main"
              test -z "${EXPECTED_APP_NAME}${EXPECTED_RESOURCE_GROUP}${EXPECTED_LIVE_URL}"
              [[ "${REGISTRY_PREFLIGHT_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
              [[ "${REGISTRY_PREFLIGHT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${REGISTRY_PREFLIGHT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              [[ "${REGISTRY_PREFLIGHT_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              test "${REGISTRY_PREFLIGHT_RUN_ID}" != "${GITHUB_RUN_ID}"
              ;;
            *)
              echo "Unsupported Azure production operation."
              exit 1
              ;;
          esac
          if [ "${OPERATION}" != "persist-accepted-release" ]; then
            test -z "${REGISTRY_PREFLIGHT_SOURCE_SHA}${REGISTRY_PREFLIGHT_RUN_ID}${REGISTRY_PREFLIGHT_RUN_ATTEMPT}${REGISTRY_PREFLIGHT_RECEIPT_SHA256}"
          fi
          case "${OPERATION}" in
            persist-accepted-release|registry-bridge-preflight)
              test -z "${EXPECTED_APP_NAME}${EXPECTED_RESOURCE_GROUP}${EXPECTED_LIVE_URL}"
              ;;
            *)
              test "${EXPECTED_APP_NAME}" = "master-data-structure-sea-9c4e0d0d"
              test "${EXPECTED_RESOURCE_GROUP}" = "rg-master-data-structure-sea"
              test "${EXPECTED_LIVE_URL}" = "https://master-data-structure-sea-9c4e0d0d.azurewebsites.net"
              ;;
          esac
          echo "control_workflow_sha=${CONTROL_WORKFLOW_REF##*@}" >> "${GITHUB_OUTPUT}"
          if [ "${OPERATION}" != "oidc-canary-read-resource" ]; then
            echo "All mutating modes remain fail-closed until this source receives independent review, exact WORM-policy and WebJob authorization is granted, the package and exact-workflow FIC are bootstrapped, the old workflow SHA is denied, and live runtime/registry canaries pass."
            exit 1
          fi

      - name: Prove exact reusable-workflow and caller claims before Azure login
        env:
          CONTROL_WORKFLOW_REF: ${{ inputs.control_workflow_ref }}
          CONTROL_WORKFLOW_SHA: ${{ steps.immutable_coordinates.outputs.control_workflow_sha }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          EXPECTED_ENVIRONMENT: paperdesk-production-control
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          set -euo pipefail
          [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == https://* ]]
          [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *$'\n'* ]]
          [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *$'\r'* ]]
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          response="${RUNNER_TEMP}/paperdesk-external-control-oidc-response.json"
          trap 'rm -f "${response}"' EXIT INT TERM
          curl \
            --fail \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --max-redirs 0 \
            --max-time 30 \
            --max-filesize 65536 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --output "${response}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          OIDC_RESPONSE="${response}" node <<'NODE'
          'use strict';
          const fs = require('fs');
          const assert = require('assert/strict');
          const response = JSON.parse(fs.readFileSync(process.env.OIDC_RESPONSE, 'utf8'));
          assert.deepEqual(Object.keys(response), ['value']);
          assert.equal(typeof response.value, 'string');
          assert.ok(response.value.length < 32768);
          const parts = response.value.split('.');
          assert.equal(parts.length, 3);
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
          assert.equal(claims.aud, 'api://AzureADTokenExchange');
          assert.equal(claims.iss, 'https://token.actions.githubusercontent.com');
          assert.equal(claims.repository, process.env.SOURCE_REPOSITORY);
          assert.equal(claims.sha, process.env.CALLER_SHA);
          assert.equal(claims.ref, process.env.GITHUB_REF);
          assert.equal(String(claims.run_id), process.env.GITHUB_RUN_ID);
          assert.equal(String(claims.run_attempt), process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(claims.workflow_ref, process.env.GITHUB_WORKFLOW_REF);
          assert.equal(claims.job_workflow_ref, process.env.CONTROL_WORKFLOW_REF);
          assert.equal(claims.job_workflow_sha, process.env.CONTROL_WORKFLOW_SHA);
          assert.equal(claims.environment, process.env.EXPECTED_ENVIRONMENT);
          assert.ok(Number.isInteger(claims.iat) && Number.isInteger(claims.nbf) && Number.isInteger(claims.exp));
          const now = Math.floor(Date.now() / 1000);
          assert.ok(claims.nbf <= now + 30 && claims.exp >= now && claims.exp - claims.iat <= 900);
          NODE

      - name: Azure login from the immutable reusable-workflow identity
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove exact Azure subscription after claim-bound login
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "${AZURE_SUBSCRIPTION_ID}"

      - name: OIDC canary reads only the exact App Service resource
        if: inputs.operation == 'oidc-canary-read-resource'
        env:
          EXPECTED_APP_NAME: ${{ inputs.expected_app_name }}
          EXPECTED_RESOURCE_GROUP: ${{ inputs.expected_resource_group }}
        run: |
          set -euo pipefail
          app_json="$(az webapp show --name "${EXPECTED_APP_NAME}" --resource-group "${EXPECTED_RESOURCE_GROUP}" --output json)"
          test "$(jq -r '.name' <<< "${app_json}")" = "${EXPECTED_APP_NAME}"
          test "$(jq -r '.resourceGroup | ascii_downcase' <<< "${app_json}")" = "$(printf '%s' "${EXPECTED_RESOURCE_GROUP}" | tr '[:upper:]' '[:lower:]')"

      - name: Download exact externally verified release material
        if: inputs.operation == 'deploy-candidate' || inputs.operation == 'rollback-accepted-release' || inputs.operation == 'persist-accepted-release'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.verified_artifact_name }}
          path: ${{ runner.temp }}/paperdesk-verified-release
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact external verification receipt
        if: inputs.operation != 'oidc-canary-read-resource'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.verification_receipt_name }}
          path: ${{ runner.temp }}/paperdesk-verification-receipt
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact receipt digest before any Azure mutation
        if: inputs.operation != 'oidc-canary-read-resource'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFIER_WORKFLOW_REF: Sethvirak/paperdesk-release-verifier/.github/workflows/verify-candidate.yml@23fc16fca795e0c6786f35aae863167fe80aa3cd
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/paperdesk-verification-receipt/paperdesk-candidate-verification-receipt-${SOURCE_SHA}.json"
          test -f "${receipt}" && test ! -L "${receipt}" && test "$(stat --format=%s "${receipt}")" -le 8192
          test "$(sha256sum "${receipt}" | cut -d ' ' -f 1)" = "${VERIFICATION_RECEIPT_SHA256}"
          jq --exit-status --arg sha "${SOURCE_SHA}" '
            .schemaVersion == 1
            and .status == "candidate-verified"
            and .candidateSha == $sha
            and .verifierWorkflow == env.VERIFIER_WORKFLOW_REF
          ' "${receipt}" >/dev/null

      - name: Resolve exact accepted-release artifact identities and digests
        id: registry_artifacts
        if: inputs.operation == 'persist-accepted-release'
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          PRODUCTION_ACCEPTANCE_RECEIPT_NAME: ${{ inputs.production_acceptance_receipt_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFICATION_RECEIPT_NAME: ${{ inputs.verification_receipt_name }}
          VERIFIED_ARTIFACT_NAME: ${{ inputs.verified_artifact_name }}
        run: |
          set -euo pipefail
          provenance="${RUNNER_TEMP}/paperdesk-verified-release/paperdesk-azure-runtime-${SOURCE_SHA}.provenance.json"
          test -f "${provenance}" && test ! -L "${provenance}" && test "$(stat --format=%s "${provenance}")" -le 65536
          source_workflow_path=".github/workflows/main_master-data-structure-sea-9c4e0d0d.yml"
          source_workflow_ref="Sethvirak/MasterDataStructure/.github/workflows/main_master-data-structure-sea-9c4e0d0d.yml@refs/heads/main"
          test "$(jq -r '.workflow' "${provenance}")" = "${source_workflow_ref}"
          test "$(jq -r '.repository' "${provenance}")" = "${SOURCE_REPOSITORY}"
          test "$(jq -r '.commit' "${provenance}")" = "${SOURCE_SHA}"
          test "$(jq -r '.runId | tostring' "${provenance}")" = "${SOURCE_RUN_ID}"
          test "$(jq -r '.runAttempt | tostring' "${provenance}")" = "${SOURCE_RUN_ATTEMPT}"
          source_event="$(jq -r '.invocation.eventName' "${provenance}")"
          test "${source_event}" = "push" || test "${source_event}" = "workflow_dispatch"
          resolve_artifact() {
            local run_id="$1" expected_attempt="$2" name="$3" prefix="$4" expected_path="$5" expected_event="$6"
            local run_json artifacts_json artifact_json
            run_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.id | tostring' <<< "${run_json}")" = "${run_id}"
            test "$(jq -r '.run_attempt | tostring' <<< "${run_json}")" = "${expected_attempt}"
            test "$(jq -r '.status' <<< "${run_json}")" = "completed"
            test "$(jq -r '.conclusion' <<< "${run_json}")" = "success"
            test "$(jq -r '.repository.full_name' <<< "${run_json}")" = "${SOURCE_REPOSITORY}"
            test "$(jq -r '.head_repository.full_name' <<< "${run_json}")" = "${SOURCE_REPOSITORY}"
            test "$(jq -r '.head_sha' <<< "${run_json}")" = "${SOURCE_SHA}"
            test "$(jq -r '.head_branch' <<< "${run_json}")" = "main"
            test "$(jq -r '.path' <<< "${run_json}")" = "${expected_path}"
            test "$(jq -r '.event' <<< "${run_json}")" = "${expected_event}"
            artifacts_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            test "$(jq --arg name "${name}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "${artifacts_json}")" -eq 1
            artifact_json="$(jq --arg name "${name}" '.artifacts[] | select(.name == $name and .expired == false)' <<< "${artifacts_json}")"
            test "$(jq -r '.workflow_run.id | tostring' <<< "${artifact_json}")" = "${run_id}"
            test "$(jq -r '.workflow_run.head_sha' <<< "${artifact_json}")" = "$(jq -r '.head_sha' <<< "${run_json}")"
            test "$(jq -r '.workflow_run.head_branch' <<< "${artifact_json}")" = "$(jq -r '.head_branch' <<< "${run_json}")"
            test "$(jq -r '.workflow_run.repository_id | tostring' <<< "${artifact_json}")" = "$(jq -r '.repository.id | tostring' <<< "${run_json}")"
            test "$(jq -r '.workflow_run.head_repository_id | tostring' <<< "${artifact_json}")" = "$(jq -r '.head_repository.id | tostring' <<< "${run_json}")"
            local id digest
            id="$(jq -r '.id | tostring' <<< "${artifact_json}")"
            digest="$(jq -r '.digest' <<< "${artifact_json}")"
            [[ "${id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${prefix}_id=${id}" >> "${GITHUB_OUTPUT}"
            echo "${prefix}_digest=${digest#sha256:}" >> "${GITHUB_OUTPUT}"
          }
          resolve_artifact "${SOURCE_RUN_ID}" "${SOURCE_RUN_ATTEMPT}" "${VERIFIED_ARTIFACT_NAME}" verified "${source_workflow_path}" "${source_event}"
          resolve_artifact "${SOURCE_RUN_ID}" "${SOURCE_RUN_ATTEMPT}" "${VERIFICATION_RECEIPT_NAME}" verification "${source_workflow_path}" "${source_event}"
          resolve_artifact "${ACCEPTANCE_RUN_ID}" "${ACCEPTANCE_RUN_ATTEMPT}" "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" acceptance ".github/workflows/main_master-data-structure-sea-9c4e0d0d.yml" workflow_dispatch
          resolve_artifact "${EVIDENCE_RUN_ID}" "${EVIDENCE_RUN_ATTEMPT}" "${EVIDENCE_ARTIFACT_NAME}" evidence ".github/workflows/production-evidence-intake.yml" workflow_dispatch

      - name: Download exact production-acceptance receipt
        if: inputs.operation == 'persist-accepted-release'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.production_acceptance_receipt_name }}
          path: ${{ runner.temp }}/paperdesk-production-acceptance-receipt
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}

      - name: Validate production-acceptance receipt before registry bridge activation
        if: inputs.operation == 'persist-accepted-release'
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.registry_artifacts.outputs.evidence_id }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          PRODUCTION_ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.production_acceptance_receipt_sha256 }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/paperdesk-production-acceptance-receipt/paperdesk-production-acceptance-receipt-${SOURCE_SHA}.json"
