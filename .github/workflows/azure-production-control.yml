          evidence="evidence/private-release-provisioning-evidence.json"
          runtime_receipt="evidence/private-release-bridge-runtime-receipt.json"
          printf '%s' "${PRIVATE_RELEASE_ACTIVATION_JSON}" > "${activation}"
          chmod 600 "${activation}"
          test -f "paperdesk-registry-control/${evidence}" && test ! -L "paperdesk-registry-control/${evidence}"
          test -f "paperdesk-registry-control/${runtime_receipt}" && test ! -L "paperdesk-registry-control/${runtime_receipt}"
          test "$(sha256sum "paperdesk-registry-control/${evidence}" | cut -d ' ' -f 1)" = "$(jq --raw-output '.activation.provisioningEvidenceSha256' "${activation}")"
          case "${CLEANUP_EVENT_NAME}" in
            workflow_run)
              test "${CLEANUP_EVENT_ACTION}" = "completed"
              test "${OWNER_STATUS}" = "completed"
              test "${OWNER_REPOSITORY}" = "Sethvirak/MasterDataStructure"
              test "${OWNER_REPOSITORY_ID}" = "1287744543"
              test "${OWNER_REPOSITORY_OWNER_ID}" = "202535166"
              test "${OWNER_HEAD_BRANCH}" = "main"
              case "${OWNER_WORKFLOW_ID}" in
                306965591)
                  test "${OWNER_NAME}" = "Build and deploy Node.js app to Azure Web App: master-data-structure-sea-9c4e0d0d"
                  test "${OWNER_PATH}" = ".github/workflows/main_master-data-structure-sea-9c4e0d0d.yml"
                  case "${OWNER_EVENT}" in push|workflow_dispatch) ;; *) exit 1 ;; esac
                  ;;
                340547201)
                  test "${OWNER_NAME}" = "Persist accepted PaperDesk release (dormant)"
                  test "${OWNER_PATH}" = ".github/workflows/persist-accepted-release.yml"
                  test "${OWNER_EVENT}" = "workflow_run"
                  ;;
                *) exit 1 ;;
              esac
              [[ "${OWNER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${OWNER_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              [[ "${OWNER_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
              jq --null-input --sort-keys --compact-output \
                --arg runId "${OWNER_RUN_ID}" --arg runAttempt "${OWNER_RUN_ATTEMPT}" \
                --arg repository "${OWNER_REPOSITORY}" --arg repositoryId "${OWNER_REPOSITORY_ID}" --arg ownerId "${OWNER_REPOSITORY_OWNER_ID}" \
                --arg workflowId "${OWNER_WORKFLOW_ID}" --arg workflowName "${OWNER_NAME}" --arg workflowPath "${OWNER_PATH}" \
                --arg event "${OWNER_EVENT}" --arg headBranch "${OWNER_HEAD_BRANCH}" --arg headSha "${OWNER_HEAD_SHA}" --arg status "${OWNER_STATUS}" \
                '{schemaVersion:1,mode:"workflow-run-completed",runId:$runId,runAttempt:$runAttempt,repository:$repository,repositoryId:$repositoryId,ownerId:$ownerId,workflowId:$workflowId,workflowName:$workflowName,workflowPath:$workflowPath,event:$event,headBranch:$headBranch,headSha:$headSha,status:$status}' > "${trigger}"
              ;;
            schedule)
              printf '%s\n' '{"mode":"scheduled-expiry","schemaVersion":1}' > "${trigger}"
              ;;
            workflow_dispatch)
              printf '%s\n' '{"mode":"manual-expiry","schemaVersion":1}' > "${trigger}"
              ;;
            *) exit 1 ;;
          esac
          test "$(git -C paperdesk-registry-control rev-parse HEAD)" = "${CONTROL_WORKFLOW_SHA}"
          test -z "$(git -C paperdesk-registry-control status --porcelain=v1 --untracked-files=all)"
          pinned_evidence="${RUNNER_TEMP}/paperdesk-private-release-provisioning-evidence.pinned.json"
          pinned_runtime_receipt="${RUNNER_TEMP}/paperdesk-private-release-bridge-runtime-receipt.pinned.json"
          git -C paperdesk-registry-control show "${CONTROL_WORKFLOW_SHA}:${evidence}" > "${pinned_evidence}"
          git -C paperdesk-registry-control show "${CONTROL_WORKFLOW_SHA}:${runtime_receipt}" > "${pinned_runtime_receipt}"
          cmp --silent "${pinned_evidence}" "paperdesk-registry-control/${evidence}"
          cmp --silent "${pinned_runtime_receipt}" "paperdesk-registry-control/${runtime_receipt}"
          test "$(sha256sum "${pinned_evidence}" | cut -d ' ' -f 1)" = "$(jq --raw-output '.activation.provisioningEvidenceSha256' "${activation}")"
          test "$(sha256sum "${pinned_runtime_receipt}" | cut -d ' ' -f 1)" = "$(jq --raw-output '.bridgeRuntime.bootstrapReceiptSha256' "${pinned_evidence}")"
          rebuilt_package="${RUNNER_TEMP}/paperdesk-private-release-bridge-source-rebuilt.zip"
          (cd paperdesk-registry-control && python3 scripts/build_private_release_bridge_package.py --output "${rebuilt_package}") >/dev/null
          test "$(sha256sum "${rebuilt_package}" | cut -d ' ' -f 1)" = "${BRIDGE_PACKAGE_SHA256}"
          (cd paperdesk-registry-control && PAPERDESK_CLEANUP_TRIGGER_JSON="$(cat "${trigger}")" python3 scripts/private_release_external_controller.py \
            --cleanup-stale \
            --activation "${activation}" \
            --provisioning-evidence "${evidence}" \
            --bridge-runtime-receipt "${runtime_receipt}" \
            --workflow-sha "${CONTROL_WORKFLOW_SHA}" \
            --package-sha "${BRIDGE_PACKAGE_SHA256}" \
            --output "${receipt}")
          test -s "${receipt}" && test ! -L "${receipt}"
          test "$(stat --format=%s "${receipt}")" -le 4096
          jq --exit-status '
            .schemaVersion == 1
            and .status as $status
            | if $status == "clean" then
                .cleaned == false and (keys | sort) == ["cleaned","schemaVersion","status"]
