                and (.cleanupMode == "terminal-owner" or .cleanupMode == "expired-owner-completed" or .cleanupMode == "expired-owner-api-unavailable")
                and (.requestNameSha256 | test("^[0-9a-f]{64}$"))
                and (.originalSettingsSha256 | test("^[0-9a-f]{64}$"))
                and (.operation | type == "string")
                and (.ownerRunConclusion | type == "string" and length > 0 and length <= 128)
                and (keys | sort) == ["cleaned","cleanupMode","operation","originalSettingsSha256","ownerRunConclusion","requestNameSha256","schemaVersion","sourceSha","status"]
              else false end
          ' "${receipt}" >/dev/null
          rm -f "${activation}" "${trigger}" "${pinned_evidence}" "${pinned_runtime_receipt}" "${rebuilt_package}"

      - name: Build deterministic bounded registry transfer request
