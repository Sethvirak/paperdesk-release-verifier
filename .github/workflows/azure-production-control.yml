          ACCEPTED_MANIFEST_BLOB: ${{ inputs.accepted_manifest_blob }}
          ACCEPTED_MANIFEST_ETAG: ${{ inputs.accepted_manifest_etag }}
          ACCEPTED_MANIFEST_SHA256: ${{ inputs.accepted_manifest_sha256 }}
          ACCEPTED_MANIFEST_SIZE: ${{ inputs.accepted_manifest_size }}
          ACCEPTED_MANIFEST_VERSION_ID: ${{ inputs.accepted_manifest_version_id }}
