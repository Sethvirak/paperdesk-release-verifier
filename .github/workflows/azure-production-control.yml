          PENDING_RELEASE_BLOB: ${{ inputs.pending_release_blob }}
          PENDING_RELEASE_ETAG: ${{ inputs.pending_release_etag }}
          PENDING_RELEASE_SHA256: ${{ inputs.pending_release_sha256 }}
          PENDING_RELEASE_SIZE: ${{ inputs.pending_release_size }}
          PENDING_RELEASE_VERSION_ID: ${{ inputs.pending_release_version_id }}
          CONSUMED_MARKER_BLOB: ${{ inputs.consumed_marker_blob }}
          CONSUMED_MARKER_ETAG: ${{ inputs.consumed_marker_etag }}
          CONSUMED_MARKER_SHA256: ${{ inputs.consumed_marker_sha256 }}
          CONSUMED_MARKER_SIZE: ${{ inputs.consumed_marker_size }}
          CONSUMED_MARKER_VERSION_ID: ${{ inputs.consumed_marker_version_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          VERIFIED_ARTIFACT_NAME: ${{ inputs.verified_artifact_name }}
          PRIVATE_RELEASE_ACTIVATION_JSON: ${{ vars.PAPERDESK_PRIVATE_RELEASE_ACTIVATION_JSON }}
        run: |
          set -euo pipefail
          activation="${RUNNER_TEMP}/paperdesk-private-release-activation.json"
          request="${RUNNER_TEMP}/paperdesk-private-release-request.json"
          result="${RUNNER_TEMP}/paperdesk-private-release-result.json"
          printf '%s' "${PRIVATE_RELEASE_ACTIVATION_JSON}" > "${activation}"
          chmod 600 "${activation}"
          if [ "${OPERATION}" = "deploy-candidate" ]; then
            artifact_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" | jq --arg name "${VERIFIED_ARTIFACT_NAME}" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0] else error("artifact") end')"
            ARTIFACT_ID="$(jq -r '.id|tostring' <<< "${artifact_json}")"
            ARTIFACT_SHA256="$(jq -r '.digest' <<< "${artifact_json}")"; ARTIFACT_SHA256="${ARTIFACT_SHA256#sha256:}"
            ARTIFACT_MEMBER="paperdesk-azure-runtime-${SOURCE_SHA}.tar.gz"
            receipt="${RUNNER_TEMP}/paperdesk-verification-receipt/paperdesk-candidate-verification-receipt-${SOURCE_SHA}.json"
