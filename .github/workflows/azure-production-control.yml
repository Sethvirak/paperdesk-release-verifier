            and .registryBridgePreflight.schemaVersion == 1
            and .registryBridgePreflight.status == "success"
            and (.registryBridgePreflight.observedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and .registryBridgePreflight.packageBootstrap == {receiptSha256: $bootstrapReceiptSha256, receipt: $currentBootstrap[0]}
            and .registryBridgePreflight.oneDeploy == $currentBootstrap[0].deployment
            and .registryBridgePreflight.bridge == $currentBootstrap[0].bridge
            and .registryBridgePreflight.webJob.name == "paperdesk-accepted-release-registry"
            and .registryBridgePreflight.webJob.apiVersion == "2025-05-01"
            and .registryBridgePreflight.webJob.runCommand == "run.sh"
            and .registryBridgePreflight.webJob.runtimeCanaryAnchor == "independently-reviewed-package-bootstrap-receipt"
            and .registryBridgePreflight.webJob.status == "Success"
            and (.registryBridgePreflight.webJob.historyId | type == "string" and length > 0)
            and (.registryBridgePreflight.webJob.webJobId | type == "string" and length > 0)
            and (.registryBridgePreflight.webJob.startedAt | type == "string" and length > 0)
            and (.registryBridgePreflight.webJob.endedAt | type == "string" and length > 0)
            and .registryBridgePreflight.wormPolicy.resourceId == $currentWorm[0].resourceId
            and .registryBridgePreflight.wormPolicy.state == $currentWorm[0].state
            and .registryBridgePreflight.wormPolicy.immutabilityPeriodSinceCreationInDays == $currentWorm[0].immutabilityPeriodSinceCreationInDays
            and .registryBridgePreflight.wormPolicy.allowProtectedAppendWrites == $currentWorm[0].allowProtectedAppendWrites
            and .registryBridgePreflight.wormPolicy.allowProtectedAppendWritesAll == $currentWorm[0].allowProtectedAppendWritesAll
            and .registryBridgePreflight.wormPolicy.etag == $currentWorm[0].etag
          ' "${receipt}" >/dev/null
          preflight_observed_at="$(jq -r '.registryBridgePreflight.observedAt' "${receipt}")"
          preflight_observed_epoch="$(date --date="${preflight_observed_at}" '+%s')"
          now_epoch="$(date --utc '+%s')"
          (( preflight_observed_epoch <= now_epoch + 300 ))
          (( now_epoch - preflight_observed_epoch <= 86400 ))

      - name: Build deterministic bounded registry transfer request
        if: inputs.operation == 'persist-accepted-release'
        env:
          ACCEPTANCE_ARTIFACT_DIGEST: ${{ steps.registry_artifacts.outputs.acceptance_digest }}
          ACCEPTANCE_ARTIFACT_ID: ${{ steps.registry_artifacts.outputs.acceptance_id }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_WORKFLOW_REF: ${{ inputs.acceptance_workflow_ref }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.registry_artifacts.outputs.evidence_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFICATION_ARTIFACT_DIGEST: ${{ steps.registry_artifacts.outputs.verification_digest }}
          VERIFICATION_ARTIFACT_ID: ${{ steps.registry_artifacts.outputs.verification_id }}
          VERIFIED_ARTIFACT_DIGEST: ${{ steps.registry_artifacts.outputs.verified_digest }}
          VERIFIED_ARTIFACT_ID: ${{ steps.registry_artifacts.outputs.verified_id }}
        run: |
          set -euo pipefail
          test "$(git -C paperdesk-registry-control rev-parse HEAD)" = "${{ steps.immutable_coordinates.outputs.control_workflow_sha }}"
          test -z "$(git -C paperdesk-registry-control status --porcelain=v1 --untracked-files=all)"
          python3 paperdesk-registry-control/scripts/accepted_release_registry.py build \
            --source-sha "${SOURCE_SHA}" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --acceptance-run-id "${ACCEPTANCE_RUN_ID}" \
            --acceptance-run-attempt "${ACCEPTANCE_RUN_ATTEMPT}" \
            --acceptance-workflow-ref "${ACCEPTANCE_WORKFLOW_REF}" \
            --evidence-run-id "${EVIDENCE_RUN_ID}" \
            --evidence-run-attempt "${EVIDENCE_RUN_ATTEMPT}" \
            --evidence-artifact-id "${EVIDENCE_ARTIFACT_ID}" \
            --evidence-artifact-name "${EVIDENCE_ARTIFACT_NAME}" \
            --evidence-bundle-sha256 "${EVIDENCE_BUNDLE_SHA256}" \
            --verified-artifact-id "${VERIFIED_ARTIFACT_ID}" \
            --verified-artifact-digest "${VERIFIED_ARTIFACT_DIGEST}" \
            --verification-artifact-id "${VERIFICATION_ARTIFACT_ID}" \
            --verification-artifact-digest "${VERIFICATION_ARTIFACT_DIGEST}" \
            --acceptance-artifact-id "${ACCEPTANCE_ARTIFACT_ID}" \
            --acceptance-artifact-digest "${ACCEPTANCE_ARTIFACT_DIGEST}" \
            --verified-artifact-dir "${RUNNER_TEMP}/paperdesk-verified-release" \
            --verification-receipt "${RUNNER_TEMP}/paperdesk-verification-receipt/paperdesk-candidate-verification-receipt-${SOURCE_SHA}.json" \
            --acceptance-receipt "${RUNNER_TEMP}/paperdesk-production-acceptance-receipt/paperdesk-production-acceptance-receipt-${SOURCE_SHA}.json" \
            --worm-snapshot "${RUNNER_TEMP}/paperdesk-registry-worm-snapshot.json" \
            --output "${RUNNER_TEMP}/paperdesk-accepted-release-request.tar.gz"

      - name: Upload exact one-shot registry transfer artifact
        id: registry_transfer
        if: inputs.operation == 'persist-accepted-release'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paperdesk-accepted-release-request-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paperdesk-accepted-release-request.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Bind exact uploaded registry transfer metadata
        if: inputs.operation == 'persist-accepted-release'
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.registry_transfer.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ steps.registry_transfer.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: paperdesk-accepted-release-request-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          artifact_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          jq --exit-status \
            --arg artifactId "${EXPECTED_ARTIFACT_ID}" \
            --arg artifactName "${EXPECTED_ARTIFACT_NAME}" \
            --arg artifactDigest "sha256:${EXPECTED_ARTIFACT_DIGEST}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg headSha "${GITHUB_SHA}" '
            (.id | tostring) == $artifactId
            and .name == $artifactName
            and .expired == false
            and .digest == $artifactDigest
            and (.size_in_bytes | type == "number" and . > 0 and . <= 1342177280)
            and .url == ("https://api.github.com/repos/" + $repository + "/actions/artifacts/" + $artifactId)
            and .archive_download_url == ("https://api.github.com/repos/" + $repository + "/actions/artifacts/" + $artifactId + "/zip")
            and (.workflow_run.id | tostring) == $runId
            and .workflow_run.head_sha == $headSha
          ' <<< "${artifact_json}" >/dev/null

      - name: Extract and deploy exact verified candidate
        if: inputs.operation == 'deploy-candidate' || inputs.operation == 'rollback-accepted-release'
        env:
          EXPECTED_APP_NAME: ${{ inputs.expected_app_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/paperdesk-verified-release"
          archive="${artifact_dir}/paperdesk-azure-runtime-${SOURCE_SHA}.tar.gz"
          checksum="${archive}.sha256"
          test -f "${archive}" && test ! -L "${archive}" && test "$(stat --format=%s "${archive}")" -le 1073741824
          test -f "${checksum}" && test ! -L "${checksum}" && test "$(wc -l < "${checksum}")" -eq 1
          (cd "${artifact_dir}" && sha256sum --check --strict "$(basename "${checksum}")")
          runtime_dir="${RUNNER_TEMP}/paperdesk-external-control-runtime"
          mkdir "${runtime_dir}"
          tar --extract --gzip --file "${archive}" --directory "${runtime_dir}"
          test "$(cat "${runtime_dir}/server/paperdesk-release-sha.txt")" = "${SOURCE_SHA}"
          tar --create --gzip --file "${RUNNER_TEMP}/paperdesk-external-control-deploy.tar.gz" --directory "${runtime_dir}" .
          echo "External workflow owns the Azure login and exact release authorization boundary."
          echo "The application-specific deployment action remains fail-closed until this workflow is activated after OIDC canary and registry review."
          exit 1

      - name: Verify exact live release without redeployment
        if: inputs.operation == 'finalize-live-release'
        env:
          EXPECTED_LIVE_URL: ${{ inputs.expected_live_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 --max-time 30 "${EXPECTED_LIVE_URL}/api/runtime-release-sha")"
          test "${live_sha}" = "${SOURCE_SHA}"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 --max-time 30 "${EXPECTED_LIVE_URL}/api/health/live" >/dev/null
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 --max-time 30 "${EXPECTED_LIVE_URL}/api/health/ready" >/dev/null

      - name: Preflight and persist accepted-release material through fixed bridge
        id: registry_bridge
        if: inputs.operation == 'registry-bridge-preflight' || inputs.operation == 'persist-accepted-release'
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          BOOTSTRAP_RECEIPT_SHA256: ${{ steps.registry_bootstrap.outputs.receipt_sha256 }}
          BRIDGE_APP_NAME: paperdesk-release-registry-bridge-9c4e0d0d
          BRIDGE_RESOURCE_GROUP: rg-master-data-structure-sea
          EXPECTED_HELPER_SHA256: 306805cefa888f0418e70d1fa3be64ec97f9fcdbe7fb1afedb5f2276a92c980b
          EXPECTED_PACKAGE_SHA256: 479bd0cc0a9d6b084cac1357716935ff7acba96186c036c0a973ebf5e34095eb
          EXPECTED_RUNNER_SHA256: fa7b97be611afd6ff36b5698793f5869e8af48a4cdf570325c2baf0fbf23f9dc
          EXPECTED_SETTINGS_SHA256: cd75a1d6bcd7fdca484962635d8bfb84b170de2ef78aac84de339f8c00180e1e
          OPERATION: ${{ inputs.operation }}
          REGISTRY_TRANSFER_ARTIFACT_ID: ${{ steps.registry_transfer.outputs.artifact-id }}
          REGISTRY_TRANSFER_ARTIFACT_SHA256: ${{ steps.registry_transfer.outputs.artifact-digest }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSIENT_GITHUB_TOKEN: ${{ inputs.operation == 'persist-accepted-release' && github.token || '' }}
        run: |
          set -euo pipefail
          readonly webjob_name="paperdesk-accepted-release-registry"
          readonly web_api_version="2025-05-01"
          transient_settings_file=""
          webjob_ended_at=""
          webjob_history_id=""
          live_onedeploy_deployment=""
          webjob_run_id=""
          webjob_run_command=""
          webjob_started_at=""
          readonly transient_settings=(
            PAPERDESK_BRIDGE_SESSION_TOKEN_SHA256
            PAPERDESK_REGISTRY_ARTIFACT_URL
            PAPERDESK_REGISTRY_ARTIFACT_HOST
            PAPERDESK_REGISTRY_GITHUB_TOKEN
            PAPERDESK_REGISTRY_GITHUB_ARTIFACT_ID
            PAPERDESK_REGISTRY_ARTIFACT_ZIP_SHA256
            PAPERDESK_REGISTRY_REQUEST_SHA256
            PAPERDESK_REGISTRY_EXPECTED_PREFIX
            PAPERDESK_REGISTRY_OPERATION
          )

          delete_transient_settings() {
            az webapp config appsettings delete \
              --name "${BRIDGE_APP_NAME}" \
              --resource-group "${BRIDGE_RESOURCE_GROUP}" \
              --setting-names "${transient_settings[@]}" \
              --only-show-errors \
              --output none
          }

          assert_transient_settings_absent() {
            local settings_json transient_setting
            settings_json="$(az webapp config appsettings list --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            for transient_setting in "${transient_settings[@]}"; do
              jq --exit-status --arg name "${transient_setting}" '[.[] | select(.name == $name)] | length == 0' <<< "${settings_json}" >/dev/null
            done
          }

          assert_bridge_stopped_and_sealed() {
            local site_json config_json policies_json settings_json site_id
            site_json="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            test "$(jq -r '.name' <<< "${site_json}")" = "${BRIDGE_APP_NAME}"
            test "$(jq -r '.resourceGroup | ascii_downcase' <<< "${site_json}")" = "$(printf '%s' "${BRIDGE_RESOURCE_GROUP}" | tr '[:upper:]' '[:lower:]')"
            test "$(jq -r '.state' <<< "${site_json}")" = "Stopped"
            test "$(jq -r '.publicNetworkAccess' <<< "${site_json}")" = "Disabled"
            site_id="$(jq -r '.id' <<< "${site_json}")"
            [[ "${site_id}" =~ /resourceGroups/${BRIDGE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${BRIDGE_APP_NAME}$ ]]
            config_json="$(az webapp config show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            test "$(jq -r '.ftpsState' <<< "${config_json}")" = "Disabled"
            test "$(jq -r '.ipSecurityRestrictionsDefaultAction' <<< "${config_json}")" = "Deny"
            test "$(jq -r '.scmIpSecurityRestrictionsDefaultAction' <<< "${config_json}")" = "Deny"
            test "$(jq -r '.scmIpSecurityRestrictionsUseMain' <<< "${config_json}")" = "true"
            test "$(jq -r '.linuxFxVersion' <<< "${config_json}")" = "PYTHON|3.12"
            test "$(jq -r '.alwaysOn' <<< "${config_json}")" = "true"
            test "$(jq -r '.webJobsEnabled' <<< "${config_json}")" = "true"
            policies_json="$(az rest --method get --url "https://management.azure.com${site_id}/basicPublishingCredentialsPolicies?api-version=${web_api_version}")"
            test "$(jq '[.value[] | select((.name == "ftp" or .name == "scm") and .properties.allow == false)] | length' <<< "${policies_json}")" -eq 2
            settings_json="$(az webapp config appsettings list --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            jq --exit-status '
              ([.[].name] | sort) == [
                "PAPERDESK_REGISTRY_HELPER_SHA256",
                "PAPERDESK_REGISTRY_PACKAGE_SHA256",
                "PAPERDESK_REGISTRY_RUNNER_SHA256",
                "PAPERDESK_REGISTRY_SETTINGS_SHA256",
                "WEBSITE_SKIP_RUNNING_KUDUAGENT"
              ]
            ' <<< "${settings_json}" >/dev/null
            jq --exit-status --arg value "false" '[.[] | select(.name == "WEBSITE_SKIP_RUNNING_KUDUAGENT" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
            jq --exit-status --arg value "${EXPECTED_PACKAGE_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_PACKAGE_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
            jq --exit-status --arg value "${EXPECTED_HELPER_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_HELPER_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
            jq --exit-status --arg value "${EXPECTED_RUNNER_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_RUNNER_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
            jq --exit-status --arg value "${EXPECTED_SETTINGS_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_SETTINGS_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
            assert_transient_settings_absent
          }

          verify_live_onedeploy_anchor() {
            local site_id live_response live_object_sha256 expected_live_deployment
            site_id="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --query id --output tsv)"
            live_response="$(az rest \
              --method get \
              --url "https://management.azure.com${site_id}/extensions/onedeploy?api-version=${web_api_version}" \
              --only-show-errors \
              --output json)"
            jq --exit-status --arg siteId "${site_id}" '
              (.value | type) == "array"
              and (.value | length) == 1
              and ((.nextLink // "") == "")
              and (.value[0].id | type == "string" and startswith($siteId + "/deployments/"))
              and (.value[0].name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
              and .value[0].id == ($siteId + "/deployments/" + .value[0].name)
              and .value[0].type == "Microsoft.Web/sites/deployments"
              and .value[0].properties.status == 4
              and .value[0].properties.active == true
              and (.value[0].properties.deployer | type == "string" and length > 0 and length <= 128 and test("^[^\\r\\n]+$"))
              and (.value[0].properties.start_time | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"))
              and (.value[0].properties.end_time | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"))
            ' <<< "${live_response}" >/dev/null
            live_object_sha256="$(jq --sort-keys --compact-output '.value[0]' <<< "${live_response}" | sha256sum | cut -d ' ' -f 1)"
            [[ "${live_object_sha256}" =~ ^[0-9a-f]{64}$ ]]
            live_onedeploy_deployment="$(jq --compact-output \
              --arg responseObjectSha256 "${live_object_sha256}" '
              .value[0] | {
                active: .properties.active,
                completedAt: .properties.end_time,
                deployer: .properties.deployer,
                deploymentId: .name,
                resourceId: .id,
                resourceType: .type,
                responseObjectSha256: $responseObjectSha256,
                startedAt: .properties.start_time,
                statusCode: .properties.status
              }
            ' <<< "${live_response}")"
            expected_live_deployment="$(jq --compact-output '.deployment.liveDeployment' paperdesk-registry-control/evidence/registry-bridge-bootstrap-receipt.json)"
            test "${live_onedeploy_deployment}" = "${expected_live_deployment}"
          }

          cleanup_bridge() {
            set +e
            az webapp stop --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --only-show-errors >/dev/null
            az webapp config access-restriction set \
              --name "${BRIDGE_APP_NAME}" \
              --resource-group "${BRIDGE_RESOURCE_GROUP}" \
              --default-action Deny \
              --scm-default-action Deny \
              --use-same-restrictions-for-scm-site true \
              --only-show-errors >/dev/null
            az resource update --ids "$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --query id --output tsv)/basicPublishingCredentialsPolicies/ftp" --set properties.allow=false --api-version 2024-11-01 --only-show-errors >/dev/null
            az resource update --ids "$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --query id --output tsv)/basicPublishingCredentialsPolicies/scm" --set properties.allow=false --api-version 2024-11-01 --only-show-errors >/dev/null
            delete_transient_settings
            if [ -n "${transient_settings_file}" ]; then
              rm -f "${transient_settings_file}"
              transient_settings_file=""
            fi
            rm -f "${RUNNER_TEMP}/paperdesk-bridge-session-token"
            unset PAPERDESK_BRIDGE_SESSION_TOKEN TRANSIENT_GITHUB_TOKEN
            set -e
            assert_bridge_stopped_and_sealed
          }

          wait_for_fixed_webjob() {
            local site_id deadline webjob_json
            site_id="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --query id --output tsv)"
            deadline=$((SECONDS + 180))
            while (( SECONDS < deadline )); do
              if webjob_json="$(az rest --method get --url "https://management.azure.com${site_id}/triggeredwebjobs/${webjob_name}?api-version=${web_api_version}" 2>/dev/null)"; then
                if jq --exit-status --arg name "${webjob_name}" '
                  .name == $name
                  and .type == "Microsoft.Web/sites/triggeredwebjobs"
                  and .properties.web_job_type == "Triggered"
                  and .properties.run_command == "run.sh"
                ' <<< "${webjob_json}" >/dev/null; then
                  webjob_run_command="$(jq -r '.properties.run_command' <<< "${webjob_json}")"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "Fixed registry WebJob did not become ARM-visible." >&2
            return 1
          }

          trigger_fixed_webjob_and_wait() {
            local site_id history_url run_url before_json before_ids deadline history_json new_histories new_count run_json status success_history_id stable_deadline stable_json stable_histories
            site_id="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --query id --output tsv)"
            history_url="https://management.azure.com${site_id}/triggeredwebjobs/${webjob_name}/history?api-version=${web_api_version}"
            run_url="https://management.azure.com${site_id}/triggeredwebjobs/${webjob_name}/run?api-version=${web_api_version}"
            before_json="$(az rest --method get --url "${history_url}")"
            jq --exit-status '.value | type == "array"' <<< "${before_json}" >/dev/null
            test "$(jq -r '.nextLink // ""' <<< "${before_json}")" = ""
            before_ids="$(jq -c '[.value[]?.id | select(type == "string" and length > 0)] | unique' <<< "${before_json}")"
            az rest --method post --url "${run_url}" --output none
            deadline=$((SECONDS + 900))
            while (( SECONDS < deadline )); do
              history_json="$(az rest --method get --url "${history_url}")"
              jq --exit-status '.value | type == "array"' <<< "${history_json}" >/dev/null
              test "$(jq -r '.nextLink // ""' <<< "${history_json}")" = ""
              new_histories="$(jq -c --argjson before "${before_ids}" '
                [.value[]?
                  | select(.id | type == "string" and length > 0)
                  | select(.id as $id | ($before | index($id)) == null)]
                | sort_by(.id)
              ' <<< "${history_json}")"
              new_count="$(jq 'length' <<< "${new_histories}")"
              if (( new_count > 1 )); then
                echo "More than one new registry WebJob run appeared inside the single-flight boundary." >&2
                return 1
              fi
              if (( new_count == 1 )); then
                run_json="$(jq -c --arg job "${webjob_name}" '
                  .[0] as $history
                  | select($history.properties.runs | type == "array" and length == 1)
                  | $history.properties.runs[0]
                  | select(.web_job_name == $job)
                  | . + {history_id: $history.id}
                ' <<< "${new_histories}")"
                test -n "${run_json}"
                status="$(jq -r '.status' <<< "${run_json}")"
                case "${status}" in
                  Success)
                    jq --exit-status --arg job "${webjob_name}" '
                      (.history_id | type == "string" and length > 0)
                      and .web_job_name == $job
                      and (.web_job_id | type == "string" and length > 0)
                      and (.start_time | type == "string" and length > 0)
                      and (.end_time | type == "string" and length > 0)
                    ' <<< "${run_json}" >/dev/null
                    success_history_id="$(jq -r '.history_id' <<< "${run_json}")"
                    webjob_history_id="${success_history_id}"
                    webjob_run_id="$(jq -r '.web_job_id' <<< "${run_json}")"
                    webjob_started_at="$(jq -r '.start_time' <<< "${run_json}")"
                    webjob_ended_at="$(jq -r '.end_time' <<< "${run_json}")"
                    stable_deadline=$((SECONDS + 15))
                    while (( SECONDS < stable_deadline )); do
                      sleep 5
                      stable_json="$(az rest --method get --url "${history_url}")"
                      jq --exit-status '.value | type == "array"' <<< "${stable_json}" >/dev/null
                      test "$(jq -r '.nextLink // ""' <<< "${stable_json}")" = ""
                      stable_histories="$(jq -c --argjson before "${before_ids}" '
                        [.value[]?
                          | select(.id | type == "string" and length > 0)
                          | select(.id as $id | ($before | index($id)) == null)]
                        | sort_by(.id)
                      ' <<< "${stable_json}")"
                      jq --exit-status --arg id "${success_history_id}" --arg job "${webjob_name}" '
                        length == 1
                        and .[0].id == $id
                        and (.[0].properties.runs | type == "array" and length == 1)
                        and .[0].properties.runs[0].web_job_name == $job
                        and .[0].properties.runs[0].status == "Success"
                      ' <<< "${stable_histories}" >/dev/null
                    done
                    return 0
                    ;;
                  Failed|Error|Aborted)
                    echo "Registry WebJob failed at the ARM history boundary." >&2
                    return 1
                    ;;
                  *)
                    echo "Registry WebJob returned an unknown ARM history status." >&2
                    return 1
                    ;;
                esac
              fi
              sleep 5
            done
            echo "Registry WebJob did not finish inside the bounded evidence window." >&2
            return 1
          }

          run_runtime_canary() {
            verify_live_onedeploy_anchor
            az webapp config appsettings set \
              --name "${BRIDGE_APP_NAME}" \
              --resource-group "${BRIDGE_RESOURCE_GROUP}" \
              --settings PAPERDESK_REGISTRY_OPERATION=runtime-canary \
              --only-show-errors \
              --output none
            az webapp start --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --only-show-errors >/dev/null
            wait_for_fixed_webjob
            trigger_fixed_webjob_and_wait
            az webapp stop --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --only-show-errors >/dev/null
            delete_transient_settings
            assert_bridge_stopped_and_sealed
            verify_live_onedeploy_anchor
          }

          write_preflight_proof() {
            local site_json config_json settings_json policies_json proof identity_keys
            verify_live_onedeploy_anchor
            test -n "${live_onedeploy_deployment}"
            test -n "${webjob_history_id}"
            test -n "${webjob_run_id}"
            test "${webjob_run_command}" = "run.sh"
            test -n "${webjob_started_at}"
            test -n "${webjob_ended_at}"
            site_json="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            config_json="$(az webapp config show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            settings_json="$(az webapp config appsettings list --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
            policies_json="$(az rest --method get --url "https://management.azure.com$(jq -r '.id' <<< "${site_json}")/basicPublishingCredentialsPolicies?api-version=${web_api_version}")"
            identity_keys="$(jq -c '.identity.userAssignedIdentities | keys | sort' <<< "${site_json}")"
            jq --exit-status '
              . == [
                "/subscriptions/9c4e0d0d-602f-4cde-84bd-337250e5b64c/resourcegroups/rg-master-data-structure-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami-paperdesk-accepted-release-reader",
                "/subscriptions/9c4e0d0d-602f-4cde-84bd-337250e5b64c/resourcegroups/rg-master-data-structure-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami-paperdesk-accepted-release-writer"
              ]
            ' <<< "${identity_keys}" >/dev/null
            jq --exit-status '
              .identity.userAssignedIdentities["/subscriptions/9c4e0d0d-602f-4cde-84bd-337250e5b64c/resourcegroups/rg-master-data-structure-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami-paperdesk-accepted-release-writer"]
                == {clientId: "1a0d95c5-bbd5-4b57-bd6c-6d5645a50e16", principalId: "2fda0f07-5dc6-4a46-b63a-9cf2616d9011"}
              and .identity.userAssignedIdentities["/subscriptions/9c4e0d0d-602f-4cde-84bd-337250e5b64c/resourcegroups/rg-master-data-structure-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami-paperdesk-accepted-release-reader"]
                == {clientId: "a52c21e2-b465-4f01-88b8-44bb5fb8b306", principalId: "c78102ff-17cd-459e-8da4-c7a900db0f86"}
            ' <<< "${site_json}" >/dev/null
            proof="${RUNNER_TEMP}/paperdesk-registry-bridge-preflight-proof.json"
            jq --null-input \
              --arg observedAt "$(date --utc '+%Y-%m-%dT%H:%M:%SZ')" \
              --arg resourceId "$(jq -r '.id' <<< "${site_json}")" \
              --arg name "${BRIDGE_APP_NAME}" \
              --arg resourceGroup "${BRIDGE_RESOURCE_GROUP}" \
              --arg state "$(jq -r '.state' <<< "${site_json}")" \
              --arg publicNetworkAccess "$(jq -r '.publicNetworkAccess' <<< "${site_json}")" \
              --arg linuxFxVersion "$(jq -r '.linuxFxVersion' <<< "${config_json}")" \
              --argjson alwaysOn "$(jq '.alwaysOn' <<< "${config_json}")" \
              --argjson webJobsEnabled "$(jq '.webJobsEnabled' <<< "${config_json}")" \
              --argjson scmUsesMain "$(jq '.scmIpSecurityRestrictionsUseMain' <<< "${config_json}")" \
              --arg ftpsState "$(jq -r '.ftpsState' <<< "${config_json}")" \
              --arg ipDefault "$(jq -r '.ipSecurityRestrictionsDefaultAction' <<< "${config_json}")" \
              --arg scmIpDefault "$(jq -r '.scmIpSecurityRestrictionsDefaultAction' <<< "${config_json}")" \
              --argjson ftpBasicAllowed "$(jq '[.value[] | select(.name == "ftp")][0].properties.allow' <<< "${policies_json}")" \
              --argjson scmBasicAllowed "$(jq '[.value[] | select(.name == "scm")][0].properties.allow' <<< "${policies_json}")" \
              --arg skipKuduAgent "$(jq -r '[.[] | select(.name == "WEBSITE_SKIP_RUNNING_KUDUAGENT")][0].value' <<< "${settings_json}")" \
              --arg packageSha256 "$(jq -r '[.[] | select(.name == "PAPERDESK_REGISTRY_PACKAGE_SHA256")][0].value' <<< "${settings_json}")" \
              --arg helperSha256 "$(jq -r '[.[] | select(.name == "PAPERDESK_REGISTRY_HELPER_SHA256")][0].value' <<< "${settings_json}")" \
              --arg runnerSha256 "$(jq -r '[.[] | select(.name == "PAPERDESK_REGISTRY_RUNNER_SHA256")][0].value' <<< "${settings_json}")" \
              --arg settingsSha256 "$(jq -r '[.[] | select(.name == "PAPERDESK_REGISTRY_SETTINGS_SHA256")][0].value' <<< "${settings_json}")" \
              --arg bootstrapReceiptSha256 "${BOOTSTRAP_RECEIPT_SHA256}" \
              --arg webJobName "${webjob_name}" \
              --arg apiVersion "${web_api_version}" \
              --arg runCommand "${webjob_run_command}" \
              --arg historyId "${webjob_history_id}" \
              --arg webJobId "${webjob_run_id}" \
              --arg startedAt "${webjob_started_at}" \
              --arg endedAt "${webjob_ended_at}" \
              --argjson liveOneDeploy "${live_onedeploy_deployment}" \
              --slurpfile bootstrap "paperdesk-registry-control/evidence/registry-bridge-bootstrap-receipt.json" \
              --slurpfile worm "${RUNNER_TEMP}/paperdesk-registry-worm-snapshot.json" '
              {
                schemaVersion: 1,
                status: "success",
                observedAt: $observedAt,
                packageBootstrap: {receiptSha256: $bootstrapReceiptSha256, receipt: $bootstrap[0]},
                oneDeploy: {
                  apiVersion: $bootstrap[0].deployment.apiVersion,
                  resourceId: $bootstrap[0].deployment.resourceId,
                  liveDeployment: $liveOneDeploy
                },
                bridge: {
                  resourceId: $resourceId,
                  name: $name,
                  resourceGroup: $resourceGroup,
                  state: $state,
                  publicNetworkAccess: $publicNetworkAccess,
                  linuxFxVersion: $linuxFxVersion,
                  alwaysOn: $alwaysOn,
                  webJobsEnabled: $webJobsEnabled,
                  scmIpSecurityRestrictionsUseMain: $scmUsesMain,
                  ftpsState: $ftpsState,
                  ipSecurityRestrictionsDefaultAction: $ipDefault,
                  scmIpSecurityRestrictionsDefaultAction: $scmIpDefault,
                  ftpBasicPublishingAllowed: $ftpBasicAllowed,
                  scmBasicPublishingAllowed: $scmBasicAllowed,
                  writerIdentityResourceId: "/subscriptions/9c4e0d0d-602f-4cde-84bd-337250e5b64c/resourcegroups/rg-master-data-structure-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami-paperdesk-accepted-release-writer",
                  writerClientId: "1a0d95c5-bbd5-4b57-bd6c-6d5645a50e16",
                  writerPrincipalId: "2fda0f07-5dc6-4a46-b63a-9cf2616d9011",
                  readerIdentityResourceId: "/subscriptions/9c4e0d0d-602f-4cde-84bd-337250e5b64c/resourcegroups/rg-master-data-structure-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami-paperdesk-accepted-release-reader",
                  readerClientId: "a52c21e2-b465-4f01-88b8-44bb5fb8b306",
                  readerPrincipalId: "c78102ff-17cd-459e-8da4-c7a900db0f86",
                  persistentSettings: {
                    WEBSITE_SKIP_RUNNING_KUDUAGENT: $skipKuduAgent,
                    PAPERDESK_REGISTRY_PACKAGE_SHA256: $packageSha256,
                    PAPERDESK_REGISTRY_HELPER_SHA256: $helperSha256,
                    PAPERDESK_REGISTRY_RUNNER_SHA256: $runnerSha256,
                    PAPERDESK_REGISTRY_SETTINGS_SHA256: $settingsSha256
                  }
                },
                webJob: {
                  name: $webJobName,
                  apiVersion: $apiVersion,
                  runCommand: $runCommand,
                  runtimeCanaryAnchor: "independently-reviewed-package-bootstrap-receipt",
                  historyId: $historyId,
                  webJobId: $webJobId,
                  status: "Success",
                  startedAt: $startedAt,
                  endedAt: $endedAt
                },
                wormPolicy: $worm[0]
              }
            ' > "${proof}"
            test -f "${proof}" && test ! -L "${proof}" && test "$(stat --format=%s "${proof}")" -le 32768
            jq --exit-status \
              --arg bootstrapReceiptSha256 "${BOOTSTRAP_RECEIPT_SHA256}" \
              --slurpfile bootstrap "paperdesk-registry-control/evidence/registry-bridge-bootstrap-receipt.json" '
              .packageBootstrap == {receiptSha256: $bootstrapReceiptSha256, receipt: $bootstrap[0]}
              and .oneDeploy == $bootstrap[0].deployment
              and .bridge == $bootstrap[0].bridge
              and .webJob.runCommand == $bootstrap[0].webJob.runCommand
              and .webJob.runtimeCanaryAnchor == "independently-reviewed-package-bootstrap-receipt"
            ' "${proof}" >/dev/null
          }

          run_persistence_once() {
            assert_bridge_stopped_and_sealed
            verify_live_onedeploy_anchor
            transient_settings_file="$(mktemp "${RUNNER_TEMP}/paperdesk-registry-settings.XXXXXX.json")"
            chmod 600 "${transient_settings_file}"
            jq --null-input \
              --arg operation persist-actions-artifact \
              --arg artifactId "${REGISTRY_TRANSFER_ARTIFACT_ID}" \
              --arg artifactSha256 "${REGISTRY_TRANSFER_ARTIFACT_SHA256}" \
              --arg requestSha256 "${request_digest}" \
              --arg expectedPrefix "${expected_prefix}" '
              (env.TRANSIENT_GITHUB_TOKEN // "") as $githubToken
              | if (($githubToken | type) == "string" and ($githubToken | length) > 0 and ($githubToken | length) <= 4096)
                then [
                  {name:"PAPERDESK_REGISTRY_OPERATION", value:$operation, slotSetting:false},
                  {name:"PAPERDESK_REGISTRY_GITHUB_TOKEN", value:$githubToken, slotSetting:false},
                  {name:"PAPERDESK_REGISTRY_GITHUB_ARTIFACT_ID", value:$artifactId, slotSetting:false},
                  {name:"PAPERDESK_REGISTRY_ARTIFACT_ZIP_SHA256", value:$artifactSha256, slotSetting:false},
                  {name:"PAPERDESK_REGISTRY_REQUEST_SHA256", value:$requestSha256, slotSetting:false},
                  {name:"PAPERDESK_REGISTRY_EXPECTED_PREFIX", value:$expectedPrefix, slotSetting:false}
                ]
                else error("transient GitHub credential is unavailable")
                end
            ' > "${transient_settings_file}"
            az webapp config appsettings set \
              --name "${BRIDGE_APP_NAME}" \
              --resource-group "${BRIDGE_RESOURCE_GROUP}" \
              --settings "@${transient_settings_file}" \
              --only-show-errors \
              --output none
            rm -f "${transient_settings_file}"
            transient_settings_file=""
            az webapp start --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --only-show-errors >/dev/null
            wait_for_fixed_webjob
            trigger_fixed_webjob_and_wait
            az webapp stop --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --only-show-errors >/dev/null
            delete_transient_settings
            assert_bridge_stopped_and_sealed
            verify_live_onedeploy_anchor
          }

          trap cleanup_bridge EXIT INT TERM
          assert_bridge_stopped_and_sealed
          verify_live_onedeploy_anchor
          if [ "${OPERATION}" = "registry-bridge-preflight" ]; then
            run_runtime_canary
            write_preflight_proof
            cleanup_bridge
            trap - EXIT INT TERM
            exit 0
          fi
          test "${OPERATION}" = "persist-accepted-release"
          test -f "${RUNNER_TEMP}/paperdesk-accepted-release-request.tar.gz"
          request_digest="$(sha256sum "${RUNNER_TEMP}/paperdesk-accepted-release-request.tar.gz" | cut -d ' ' -f 1)"
          [[ "${request_digest}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${REGISTRY_TRANSFER_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REGISTRY_TRANSFER_ARTIFACT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          expected_prefix="v1/releases/${SOURCE_SHA}/${SOURCE_RUN_ID}/${ACCEPTANCE_RUN_ID}/"

          # This source-complete path remains unreachable behind the independent-review
          # hard stop above. Activation requires a later reviewed commit that binds an
          # independently reviewed canonical package-bootstrap receipt and checksum from
          # this immutable checkout, exact-workflow FIC rotation, narrow WebJob RBAC,
          # removed bootstrap publish authority, and old-workflow denial proof.
          run_runtime_canary
          run_persistence_once
          run_persistence_once
          unset TRANSIENT_GITHUB_TOKEN
          cleanup_bridge
          trap - EXIT INT TERM

      - name: Seal fixed registry bridge after every bridge attempt
        if: always() && (inputs.operation == 'registry-bridge-preflight' || inputs.operation == 'persist-accepted-release')
        env:
          BRIDGE_APP_NAME: paperdesk-release-registry-bridge-9c4e0d0d
          BRIDGE_RESOURCE_GROUP: rg-master-data-structure-sea
          EXPECTED_HELPER_SHA256: 306805cefa888f0418e70d1fa3be64ec97f9fcdbe7fb1afedb5f2276a92c980b
          EXPECTED_PACKAGE_SHA256: 479bd0cc0a9d6b084cac1357716935ff7acba96186c036c0a973ebf5e34095eb
          EXPECTED_RUNNER_SHA256: fa7b97be611afd6ff36b5698793f5869e8af48a4cdf570325c2baf0fbf23f9dc
          EXPECTED_SETTINGS_SHA256: cd75a1d6bcd7fdca484962635d8bfb84b170de2ef78aac84de339f8c00180e1e
        run: |
          set -uo pipefail
          readonly web_api_version="2025-05-01"
          cleanup_failed=0
          site_id_valid=0
          site_id="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --query id --output tsv)" || cleanup_failed=1
          if [[ "${site_id}" =~ /resourceGroups/${BRIDGE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${BRIDGE_APP_NAME}$ ]]; then
            site_id_valid=1
          else
            cleanup_failed=1
          fi
          az webapp stop --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --only-show-errors || cleanup_failed=1
          az webapp config access-restriction set \
            --name "${BRIDGE_APP_NAME}" \
            --resource-group "${BRIDGE_RESOURCE_GROUP}" \
            --default-action Deny \
            --scm-default-action Deny \
            --use-same-restrictions-for-scm-site true \
            --only-show-errors >/dev/null || cleanup_failed=1
          if [ "${site_id_valid}" -eq 1 ]; then
            az resource update --ids "${site_id}/basicPublishingCredentialsPolicies/ftp" --set properties.allow=false --api-version 2024-11-01 --only-show-errors >/dev/null || cleanup_failed=1
            az resource update --ids "${site_id}/basicPublishingCredentialsPolicies/scm" --set properties.allow=false --api-version 2024-11-01 --only-show-errors >/dev/null || cleanup_failed=1
          else
            cleanup_failed=1
          fi
          az webapp config appsettings delete \
            --name "${BRIDGE_APP_NAME}" \
            --resource-group "${BRIDGE_RESOURCE_GROUP}" \
            --setting-names \
              PAPERDESK_BRIDGE_SESSION_TOKEN_SHA256 \
              PAPERDESK_REGISTRY_ARTIFACT_URL \
              PAPERDESK_REGISTRY_ARTIFACT_HOST \
              PAPERDESK_REGISTRY_GITHUB_TOKEN \
              PAPERDESK_REGISTRY_GITHUB_ARTIFACT_ID \
              PAPERDESK_REGISTRY_ARTIFACT_ZIP_SHA256 \
              PAPERDESK_REGISTRY_REQUEST_SHA256 \
              PAPERDESK_REGISTRY_EXPECTED_PREFIX \
              PAPERDESK_REGISTRY_OPERATION \
            --only-show-errors >/dev/null || cleanup_failed=1
          set -e
          site_json="$(az webapp show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
          config_json="$(az webapp config show --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
          policies_json="$(az rest --method get --url "https://management.azure.com${site_id}/basicPublishingCredentialsPolicies?api-version=${web_api_version}")"
          settings_json="$(az webapp config appsettings list --name "${BRIDGE_APP_NAME}" --resource-group "${BRIDGE_RESOURCE_GROUP}" --output json)"
          test "$(jq -r '.state' <<< "${site_json}")" = "Stopped"
          test "$(jq -r '.publicNetworkAccess' <<< "${site_json}")" = "Disabled"
          test "$(jq -r '.ftpsState' <<< "${config_json}")" = "Disabled"
          test "$(jq -r '.ipSecurityRestrictionsDefaultAction' <<< "${config_json}")" = "Deny"
          test "$(jq -r '.scmIpSecurityRestrictionsDefaultAction' <<< "${config_json}")" = "Deny"
          test "$(jq -r '.scmIpSecurityRestrictionsUseMain' <<< "${config_json}")" = "true"
          test "$(jq -r '.linuxFxVersion' <<< "${config_json}")" = "PYTHON|3.12"
          test "$(jq -r '.alwaysOn' <<< "${config_json}")" = "true"
          test "$(jq -r '.webJobsEnabled' <<< "${config_json}")" = "true"
          test "$(jq '[.value[] | select((.name == "ftp" or .name == "scm") and .properties.allow == false)] | length' <<< "${policies_json}")" -eq 2
          jq --exit-status '
            ([.[].name] | sort) == [
              "PAPERDESK_REGISTRY_HELPER_SHA256",
              "PAPERDESK_REGISTRY_PACKAGE_SHA256",
              "PAPERDESK_REGISTRY_RUNNER_SHA256",
              "PAPERDESK_REGISTRY_SETTINGS_SHA256",
              "WEBSITE_SKIP_RUNNING_KUDUAGENT"
            ]
          ' <<< "${settings_json}" >/dev/null
          jq --exit-status --arg value false '[.[] | select(.name == "WEBSITE_SKIP_RUNNING_KUDUAGENT" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
          jq --exit-status --arg value "${EXPECTED_PACKAGE_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_PACKAGE_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
          jq --exit-status --arg value "${EXPECTED_HELPER_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_HELPER_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
          jq --exit-status --arg value "${EXPECTED_RUNNER_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_RUNNER_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
          jq --exit-status --arg value "${EXPECTED_SETTINGS_SHA256}" '[.[] | select(.name == "PAPERDESK_REGISTRY_SETTINGS_SHA256" and .value == $value)] | length == 1' <<< "${settings_json}" >/dev/null
          for transient_setting in \
            PAPERDESK_BRIDGE_SESSION_TOKEN_SHA256 \
            PAPERDESK_REGISTRY_ARTIFACT_URL \
            PAPERDESK_REGISTRY_ARTIFACT_HOST \
            PAPERDESK_REGISTRY_GITHUB_TOKEN \
            PAPERDESK_REGISTRY_GITHUB_ARTIFACT_ID \
            PAPERDESK_REGISTRY_ARTIFACT_ZIP_SHA256 \
            PAPERDESK_REGISTRY_REQUEST_SHA256 \
            PAPERDESK_REGISTRY_EXPECTED_PREFIX \
            PAPERDESK_REGISTRY_OPERATION
          do
            jq --exit-status --arg name "${transient_setting}" '[.[] | select(.name == $name)] | length == 0' <<< "${settings_json}" >/dev/null
          done
          test "${cleanup_failed}" -eq 0

      - name: Create bounded control receipt
        id: receipt
        if: always()
        env:
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_WORKFLOW_REF: ${{ inputs.acceptance_workflow_ref }}
          CONTROL_WORKFLOW_REF: ${{ inputs.control_workflow_ref }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          OPERATION: ${{ inputs.operation }}
          PRODUCTION_ACCEPTANCE_RECEIPT_NAME: ${{ inputs.production_acceptance_receipt_name }}
          PRODUCTION_ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.production_acceptance_receipt_sha256 }}
          REGISTRY_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.registry_preflight_receipt_sha256 }}
          REGISTRY_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.registry_preflight_run_attempt }}
          REGISTRY_PREFLIGHT_RUN_ID: ${{ inputs.registry_preflight_run_id }}
          REGISTRY_PREFLIGHT_SOURCE_SHA: ${{ inputs.registry_preflight_source_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFICATION_RECEIPT_NAME: ${{ inputs.verification_receipt_name }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/paperdesk-external-control-receipt"
          receipt_name="paperdesk-external-control-${OPERATION}-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          mkdir "${receipt_dir}"
          registry_bridge_preflight=null
          preflight_proof="${RUNNER_TEMP}/paperdesk-registry-bridge-preflight-proof.json"
          if [ -f "${preflight_proof}" ] && [ ! -L "${preflight_proof}" ]; then
            test "$(stat --format=%s "${preflight_proof}")" -le 32768
            registry_bridge_preflight="$(jq --compact-output '.' "${preflight_proof}")"
          elif [ "${OPERATION}" = "registry-bridge-preflight" ] && [ "${{ job.status }}" = "success" ]; then
            echo "A successful registry bridge preflight must retain its exact proof." >&2
            exit 1
          fi
          jq --null-input \
            --arg schemaVersion '2' \
            --arg status "${{ job.status }}" \
            --arg operation "${OPERATION}" \
            --arg sourceRepository "${SOURCE_REPOSITORY}" \
            --arg callerWorkflowRef "${GITHUB_WORKFLOW_REF}" \
            --arg sourceSha "${SOURCE_SHA}" \
            --arg sourceRunId "${SOURCE_RUN_ID}" \
            --arg sourceRunAttempt "${SOURCE_RUN_ATTEMPT}" \
            --arg controlWorkflowRef "${CONTROL_WORKFLOW_REF}" \
            --arg controlRunId "${GITHUB_RUN_ID}" \
            --arg controlRunAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg acceptanceRunId "${ACCEPTANCE_RUN_ID}" \
            --arg acceptanceRunAttempt "${ACCEPTANCE_RUN_ATTEMPT}" \
            --arg acceptanceWorkflowRef "${ACCEPTANCE_WORKFLOW_REF}" \
            --arg evidenceRunId "${EVIDENCE_RUN_ID}" \
            --arg evidenceRunAttempt "${EVIDENCE_RUN_ATTEMPT}" \
            --arg evidenceArtifactName "${EVIDENCE_ARTIFACT_NAME}" \
            --arg evidenceBundleSha256 "${EVIDENCE_BUNDLE_SHA256}" \
            --arg verificationReceiptName "${VERIFICATION_RECEIPT_NAME}" \
            --arg verificationReceiptSha256 "${VERIFICATION_RECEIPT_SHA256}" \
            --arg productionAcceptanceReceiptName "${PRODUCTION_ACCEPTANCE_RECEIPT_NAME}" \
            --arg productionAcceptanceReceiptSha256 "${PRODUCTION_ACCEPTANCE_RECEIPT_SHA256}" \
            --arg registryPreflightSourceSha "${REGISTRY_PREFLIGHT_SOURCE_SHA}" \
            --arg registryPreflightRunId "${REGISTRY_PREFLIGHT_RUN_ID}" \
            --arg registryPreflightRunAttempt "${REGISTRY_PREFLIGHT_RUN_ATTEMPT}" \
            --arg registryPreflightReceiptSha256 "${REGISTRY_PREFLIGHT_RECEIPT_SHA256}" \
            --argjson registryBridgePreflight "${registry_bridge_preflight}" \
            --arg registryPrefix "$(if [ "${OPERATION}" = "persist-accepted-release" ]; then printf 'v1/releases/%s/%s/%s/' "${SOURCE_SHA}" "${SOURCE_RUN_ID}" "${ACCEPTANCE_RUN_ID}"; fi)" \
            '{schemaVersion: ($schemaVersion | tonumber), status: $status, operation: $operation, sourceRepository: $sourceRepository, callerWorkflowRef: $callerWorkflowRef, sourceSha: $sourceSha, sourceRunId: $sourceRunId, sourceRunAttempt: $sourceRunAttempt, controlWorkflowRef: $controlWorkflowRef, controlRunId: $controlRunId, controlRunAttempt: $controlRunAttempt, acceptanceRunId: $acceptanceRunId, acceptanceRunAttempt: $acceptanceRunAttempt, acceptanceWorkflowRef: $acceptanceWorkflowRef, evidenceRunId: $evidenceRunId, evidenceRunAttempt: $evidenceRunAttempt, evidenceArtifactName: $evidenceArtifactName, evidenceBundleSha256: $evidenceBundleSha256, verificationReceiptName: $verificationReceiptName, verificationReceiptSha256: $verificationReceiptSha256, productionAcceptanceReceiptName: $productionAcceptanceReceiptName, productionAcceptanceReceiptSha256: $productionAcceptanceReceiptSha256, registryPreflightSourceSha: $registryPreflightSourceSha, registryPreflightRunId: $registryPreflightRunId, registryPreflightRunAttempt: $registryPreflightRunAttempt, registryPreflightReceiptSha256: $registryPreflightReceiptSha256, registryBridgePreflight: $registryBridgePreflight, registryPrefix: $registryPrefix}' \
            > "${receipt_dir}/${receipt_name}"
          echo "operation_receipt_name=paperdesk-external-control-${OPERATION}-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "operation_receipt_sha256=$(sha256sum "${receipt_dir}/${receipt_name}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Retain immutable-control receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paperdesk-external-control-${{ inputs.operation }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paperdesk-external-control-receipt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
