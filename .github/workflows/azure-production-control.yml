      - name: Check out immutable registry control and bootstrap trust anchor
        if: inputs.operation == 'registry-bridge-preflight' || inputs.operation == 'bootstrap-current-production' || inputs.operation == 'deploy-candidate' || inputs.operation == 'persist-accepted-release' || inputs.operation == 'rollback-accepted-release' || inputs.operation == 'cleanup-transient'
