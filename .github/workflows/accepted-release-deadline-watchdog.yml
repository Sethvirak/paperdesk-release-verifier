name: PaperDesk accepted-release deadline watchdog v2

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperdesk-accepted-release-deadline-watchdog-v2
  cancel-in-progress: false

jobs:
  enforce_deadline:
    name: Evaluate provider state and request one claim-bound rollback
    if: github.event_name == 'workflow_dispatch' || vars.PAPERDESK_WATCHDOG_MODE == 'accepted-release-deadline-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: paperdesk-watchdog
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact watchdog workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact dormant v2 source and fixed coordinates
        env:
          BASELINE_RECEIPT_SHA256: ${{ vars.PAPERDESK_WATCHDOG_BASELINE_RECEIPT_SHA256 }}
          RUNBOOK_URL: ${{ vars.PAPERDESK_WATCHDOG_RUNBOOK_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_WORKFLOW_SHA}"
          test "${GITHUB_REPOSITORY}" = "Sethvirak/paperdesk-release-verifier"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'f8b3e9123eff6555eb6201b3784a1ebe7c222a586ca778eea914fb68a212da0f  scripts/check_deadline.py' | sha256sum --check --strict
          echo '2c94ef28d3b9f2cd565fb899c8e1c5a4ea5bd84d6a28b390c48ce2639b3d638d  scripts/watchdog_evidence.py' | sha256sum --check --strict
          echo 'ee86948d567fd2100c6752558cafb0d0f2baec78f96fe898533a95fe2bf6b5e4  scripts/watchdog_contract.py' | sha256sum --check --strict
          echo 'a45523da21765df707009a965317afe5f7a8642657da3bd24af946d8b7ccb9e9  provider/watchdog_state_provider.py' | sha256sum --check --strict
          echo '80b4a7d1758f7da20b8a9b71864317143aa8c705a942834b928ce3d9c75abef6  provider/accepted_release_manifest.py' | sha256sum --check --strict
          echo '8ffd20a7c9c7ce00a7b167de88dcfe29845cec62ccbf595a060635b07727e898  contracts/production_release_watchdog_contract.json' | sha256sum --check --strict
          test "${#BASELINE_RECEIPT_SHA256}" -eq 64
          [[ "${BASELINE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/watchdog_evidence.py validate-config
          python3 scripts/check_deadline.py \
            --validate-config-only \
            --state-url 'https://paperdesk-watchdog-state-9c4e0d0d.azurewebsites.net/api/watchdog-state/v2' \
            --state-host 'paperdesk-watchdog-state-9c4e0d0d.azurewebsites.net' \
            --runbook-url "${RUNBOOK_URL}" \
            --source-repository 'Sethvirak/MasterDataStructure' \
            --watchdog-workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --watchdog-workflow-sha "${GITHUB_WORKFLOW_SHA}" \
            --control-checkout-sha "$(git rev-parse HEAD)" \
            --watchdog-run-id "${GITHUB_RUN_ID}" \
            --watchdog-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --baseline-receipt-sha256 "${BASELINE_RECEIPT_SHA256}"

      - name: Source-dormant hard stop before GitHub OIDC or provider calls
        run: |
          set -euo pipefail
          echo 'Watchdog v2 activation is blocked: mergedMutatingCommitSha is null, the independently reviewed initial baseline is absent, and live provider/GitHub App canaries have not passed.' >&2
          exit 1

      - name: Fetch exact canonical provider state with transient OIDC
        id: state
        run: |
          set -euo pipefail
          mkdir -m 700 "${RUNNER_TEMP}/paperdesk-watchdog-v2"
          python3 scripts/watchdog_evidence.py fetch-state \
            --repository "${GITHUB_REPOSITORY}" \
            --caller-sha "${GITHUB_WORKFLOW_SHA}" \
            --ref "${GITHUB_REF}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --environment 'paperdesk-watchdog' \
            --event-name "${GITHUB_EVENT_NAME}" \
            --output "${RUNNER_TEMP}/paperdesk-watchdog-v2/state.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Create bounded claim decision from exact fresh state
        id: decision
        env:
          BASELINE_RECEIPT_SHA256: ${{ vars.PAPERDESK_WATCHDOG_BASELINE_RECEIPT_SHA256 }}
          RUNBOOK_URL: ${{ vars.PAPERDESK_WATCHDOG_RUNBOOK_URL }}
          STATE_ETAG: ${{ steps.state.outputs.state_etag }}
        run: |
          set -euo pipefail
          python3 scripts/check_deadline.py \
            --state "${RUNNER_TEMP}/paperdesk-watchdog-v2/state.json" \
            --state-etag "${STATE_ETAG}" \
            --state-url 'https://paperdesk-watchdog-state-9c4e0d0d.azurewebsites.net/api/watchdog-state/v2' \
            --state-host 'paperdesk-watchdog-state-9c4e0d0d.azurewebsites.net' \
            --runbook-url "${RUNBOOK_URL}" \
            --source-repository 'Sethvirak/MasterDataStructure' \
            --watchdog-workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --watchdog-workflow-sha "${GITHUB_WORKFLOW_SHA}" \
            --control-checkout-sha "$(git rev-parse HEAD)" \
            --watchdog-run-id "${GITHUB_RUN_ID}" \
            --watchdog-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --baseline-receipt-sha256 "${BASELINE_RECEIPT_SHA256}" \
            --output "${RUNNER_TEMP}/paperdesk-watchdog-v2/decision.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Atomically WORM-record and CAS-claim an overdue candidate
        if: steps.decision.outputs.decision == 'dispatch-rollback'
        id: claim
        run: |
          set -euo pipefail
          python3 scripts/watchdog_evidence.py claim \
            --repository "${GITHUB_REPOSITORY}" \
            --caller-sha "${GITHUB_WORKFLOW_SHA}" \
            --ref "${GITHUB_REF}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --environment 'paperdesk-watchdog' \
            --event-name "${GITHUB_EVENT_NAME}" \
            --decision "${RUNNER_TEMP}/paperdesk-watchdog-v2/decision.json" \
            --output "${RUNNER_TEMP}/paperdesk-watchdog-v2/claim.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Release only an expired unattempted claim through provider reconciliation
        if: steps.decision.outputs.decision == 'rollback-claim-expired-unattempted'
        env:
          CLAIM_ID: ${{ steps.decision.outputs.claim_id }}
        run: |
          set -euo pipefail
          python3 scripts/watchdog_evidence.py reconcile \
            --repository "${GITHUB_REPOSITORY}" \
            --caller-sha "${GITHUB_WORKFLOW_SHA}" \
            --ref "${GITHUB_REF}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --environment 'paperdesk-watchdog' \
            --event-name "${GITHUB_EVENT_NAME}" \
            --claim-id "${CLAIM_ID}" \
            --mode automatic \
            --output "${RUNNER_TEMP}/paperdesk-watchdog-v2/reconciliation-auto.json"

      - name: Ask provider to WORM-record attempt and return HTTP 200 run binding
        if: steps.decision.outputs.decision == 'dispatch-rollback'
        run: |
          set -euo pipefail
          python3 scripts/watchdog_evidence.py provider-dispatch \
            --repository "${GITHUB_REPOSITORY}" \
            --caller-sha "${GITHUB_WORKFLOW_SHA}" \
            --ref "${GITHUB_REF}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --environment 'paperdesk-watchdog' \
            --event-name "${GITHUB_EVENT_NAME}" \
            --claim "${RUNNER_TEMP}/paperdesk-watchdog-v2/claim.json" \
            --output "${RUNNER_TEMP}/paperdesk-watchdog-v2/dispatch.json"

      - name: Retain non-secret local projections for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paperdesk-watchdog-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paperdesk-watchdog-v2
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
